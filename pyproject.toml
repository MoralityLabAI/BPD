[project]
name = "bpd"
version = "0.1.0"
description = "Behavioral Parameter Decomposition (BPD) and Causal Dark Fibers for Weight-Tied Looped Transformers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
neural = [
    "torch>=2.5",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = [
    "mechinterp/bpd/tests",
    "mechinterp/dark_fiber_gyms/tests",
    "mechinterp/dark_fiber_gyms/arg03_preunseal/tests",
    "experiments/bpd_lean_curriculum_v2",
]
pythonpath = ["."]
