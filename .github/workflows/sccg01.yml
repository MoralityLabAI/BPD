name: SCCG01 selective control reference
on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sccg01/**'
      - '.github/workflows/sccg01.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sccg01/**'
      - '.github/workflows/sccg01.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python -m mechinterp.bpd.experiments.sccg01.exact_witnesses
      - run: python -m unittest discover -s mechinterp/bpd/experiments/sccg01/ -p 'test_*.py' -v
