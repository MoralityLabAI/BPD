name: Pretrained 7M TRM native boundary pilot

on:
  push:
    branches:
      - research/inkling-cross-loop-causal-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_pilot.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_native_trm_pilot.py"
      - ".github/workflows/bpd-native-trm-inkling-pilot.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_pilot.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_native_trm_pilot.py"
      - ".github/workflows/bpd-native-trm-inkling-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-trm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<3" "huggingface_hub>=0.24,<1"
      - name: Unit-test native recurrence and dose checks
        run: >-
          python -m unittest
          mechinterp.bpd.experiments.inkling_reader_v0.test_native_trm_pilot -v
      - name: Run SHA-pinned pretrained pilot and harder paired development cohort
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 780s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.native_trm_pilot \
            --model gaoxin492 --roots 1 --holes 22 --outer-steps 1 \
            --out runs/inkling_native_trm_pilot_20261121.json
          timeout --signal=TERM --kill-after=15s 780s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.native_trm_pilot \
            --model gaoxin492 --roots 24 --holes 40 --outer-steps 1 \
            --relative-dose 0.5 --patch-h-cycle 1 \
            --out runs/inkling_native_trm_hard_early_20261121.json
          timeout --signal=TERM --kill-after=15s 780s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.native_trm_pilot \
            --model gaoxin492 --roots 24 --holes 40 --outer-steps 1 \
            --relative-dose 0.5 --patch-h-cycle 2 \
            --out runs/inkling_native_trm_hard_late_20261121.json
          timeout --signal=TERM --kill-after=15s 780s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.native_trm_pilot \
            --model gaoxin492 --roots 24 --holes 40 --outer-steps 2 \
            --relative-dose 0.5 --patch-h-cycle 1 \
            --out runs/inkling_native_trm_hard_depth2_20261121.json
      - name: Independently replay Sudoku outcomes and raw dose receipts
        if: github.event_name == 'push'
        run: |
          python -m mechinterp.bpd.experiments.inkling_reader_v0.native_receipt_audit \
            runs/inkling_native_trm_pilot_20261121.json \
            runs/inkling_native_trm_hard_early_20261121.json \
            runs/inkling_native_trm_hard_late_20261121.json \
            runs/inkling_native_trm_hard_depth2_20261121.json \
            --out runs/inkling_native_trm_receipt_audit.json
      - name: Retain native model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-native-trm-cpu-pilot
          path: runs/inkling_native_trm_*.json
          if-no-files-found: warn
          retention-days: 7
