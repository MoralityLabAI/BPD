name: SCCG09 baseline protection
on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sccg01/baseline_atlas.py'
      - 'mechinterp/bpd/experiments/sccg01/baseline_benchmark.py'
      - '.github/workflows/sccg09.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sccg01/baseline_atlas.py'
      - 'mechinterp/bpd/experiments/sccg01/baseline_benchmark.py'
      - '.github/workflows/sccg09.yml'
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install sympy==1.14.0
      - run: python mechinterp/bpd/experiments/sccg01/baseline_benchmark.py --output sccg09_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: sccg09-baseline-receipt
          path: sccg09_receipt.json
