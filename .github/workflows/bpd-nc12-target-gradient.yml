name: BPD-NC-12 nested target-gradient frontier (engineering only)
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc12/PROTOCOL.md'
      - 'mechinterp/bpd/experiments/nc12/experiment.py'
      - 'mechinterp/bpd/experiments/nc12/aggregate.py'
      - 'mechinterp/bpd/experiments/nc12/test_experiment.py'
      - 'mechinterp/bpd/experiments/nc12/EXECUTE_LOCK.json'
      - '.github/workflows/bpd-nc12-target-gradient.yml'
  workflow_dispatch:

jobs:
  source-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Verify prospective protocol-first source hashes and no confirmation access
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('mechinterp/bpd/experiments/nc12/EXECUTE_LOCK.json')
          lock=json.loads(p.read_text())
          assert lock['study']=='BPD-NC-12'
          assert lock['status']=='SOURCE_LOCK_AMENDED_BEFORE_FIRST_NC12_DEVELOPMENT_ROOT'
          assert len(lock['predevelopment_amendments'])==1
          assert lock['predevelopment_amendments'][0]['first_development_job'].startswith('skipped')
          assert lock['protocol_first_commit']=='6a4b5ebc16fae730f17b0e5dac5564eaf419c071'
          assert lock['roots']==list(range(1200,1208))
          assert lock['excluded_smoke_root']==1199
          assert lock['budgets']['total_unique_primary_B_gradient_rows']==32
          assert lock['budgets']['nested_gradient_case_budgets']==[4,8,16,32]
          assert lock['comparisons']==16
          for file,sha in lock['source_blob_sha1'].items():
              actual=subprocess.check_output(['git','hash-object',file],text=True).strip()
              assert actual==sha,(file,actual,sha)
          print('NC12 first source lock verified')
          PY
      - name: Recurrent causal geometry, information-budget and negative-root tests
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc12
          python -m pytest -q mechinterp/bpd/experiments/nc12/test_experiment.py
      - name: Excluded smoke root 1199, all four nested gradient budgets
        run: |
          python -m mechinterp.bpd.experiments.nc12.experiment \
            --root 1199 --steps 384 --discovery-size 256 \
            --dose-size 256 --evaluation-size 256 --proposals 256 \
            --out /tmp/nc12_smoke.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nc12_smoke.json'))
          assert x['study']=='BPD-NC-12' and x['phase']=='ENGINEERING'
          assert x['root']==1199
          assert x['protocol_commit']=='6a4b5ebc16fae730f17b0e5dac5564eaf419c071'
          assert x['calibration']['nested_gradient_union']==32
          assert len(x['q_arms'])==4
          print('excluded smoke closures',x['closure'])
          print('smoke q gate and sham candidates',[
              (q,v['technically_admitted'],v.get('sham_matching',{}).get('qualified'),
               v.get('excluded_reasons')) for q,v in x['q_arms'].items()
          ])
          print('source-only negative head',x['negative_control'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc12-source-excluded-smoke
          path: /tmp/nc12_smoke.json
          if-no-files-found: warn

  development-eight-pairs:
    runs-on: ubuntu-latest
    needs: source-and-smoke
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26'
      - name: Recheck exact pre-data source hash lock
        run: |
          python - <<'PY'
          import subprocess,json
          lock=json.load(open('mechinterp/bpd/experiments/nc12/EXECUTE_LOCK.json'))
          for path,sha in lock['source_blob_sha1'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha,path
          assert lock['confirmation']=='SEALED'
          print('NC12 original source-lock preserved')
          PY
      - name: Train eight independent pairs, score 16 source-registered contrasts
        run: |
          mkdir -p /tmp/nc12_development
          for root in 1200 1201 1202 1203 1204 1205 1206 1207; do
            python -m mechinterp.bpd.experiments.nc12.experiment \
              --root "$root" --steps 384 --discovery-size 1024 \
              --dose-size 1024 --evaluation-size 1024 --proposals 2048 \
              --out "/tmp/nc12_development/nc12_root_${root}.json"
          done
          python -m mechinterp.bpd.experiments.nc12.aggregate \
            --directory /tmp/nc12_development \
            --out /tmp/nc12_development/NC12_ORIGINAL_SUMMARY.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nc12_development/NC12_ORIGINAL_SUMMARY.json'))
          assert x['independent_training_pairs']==8
          assert x['model_initializations']==16
          assert len(x['arms'])==4 and x['family_directional_comparisons']==16
          assert x['scientific_status']=='NOT_CONFIRMATORY'
          assert x['original_development_verdict'] in (
              'ENGINEERING_LOW_BUDGET_TRANSFER','ENGINEERING_NULL_OR_INELIGIBLE'
          )
          assert x['confirmation'].startswith('SEALED')
          print('ORIGINAL registered NC12 verdict',x['original_development_verdict'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc12-original-eight-pair-low-query-receipts
          path: /tmp/nc12_development/
          if-no-files-found: warn
