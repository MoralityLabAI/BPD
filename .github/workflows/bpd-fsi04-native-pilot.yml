name: BPD FSI-04 fresh-roster and physical-dose preflight
on:
  push:
    paths:
      - 'mechinterp/dark_fiber_gyms/fsi04/**'
      - 'mechinterp/dark_fiber_gyms/tests/fsi04_source_checks.py'
      - 'mechinterp/FSI04_NATIVE_PILOT.md'
      - '.github/workflows/bpd-fsi04-native-pilot.yml'
  pull_request:
    paths:
      - 'mechinterp/dark_fiber_gyms/fsi04/**'
      - 'mechinterp/dark_fiber_gyms/tests/fsi04_source_checks.py'
      - 'mechinterp/FSI04_NATIVE_PILOT.md'
      - '.github/workflows/bpd-fsi04-native-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-power-brake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 2fdd5fe3f499070b63c474a2455f0e2c00fc55a8
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute historical root-level power and sham exposure
        run: |
          export EVALMATH_PREFLIGHT_FILE="$GITHUB_WORKSPACE/.deps/evalmath/skills/evalmath-mechinterp-power/scripts/preflight.py"
          python -m mechinterp.dark_fiber_gyms.fsi04.historical_preflight --out /tmp/bpd_fsi04_history.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/bpd_fsi04_history.json'))
          assert r['decision']=='DOSE_MATCHED_FRESH_PILOT_ONLY'
          assert r['pilot_preflight']['decision']=='REDESIGN_OR_PILOT_ONLY'
          assert r['historical']['yagizdevre']['mean_donor_minus_clean']<0
          assert r['historical']['yagizdevre']['mean_random_minus_clean']<0
          assert r['minimum_independent_roots_for_95th_quantile_95pct_confidence']==59
          assert r['fresh_s4_roots_specified']==24
          assert 'untouched' in r['heldout_seal']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bpd-fsi04-public-historical-power-brake
          path: /tmp/bpd_fsi04_history.json

  synthetic-controls-and-fresh-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 2fdd5fe3f499070b63c474a2455f0e2c00fc55a8
          path: .deps/evalmath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only torch and numpy for synthetic geometry tests
        run: |
          python -m pip install --disable-pip-version-check numpy==2.1.3
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify physical dose, exact readout, causal outcomes and no data leakage
        run: |
          export EVALMATH_PREFLIGHT_FILE="$GITHUB_WORKSPACE/.deps/evalmath/skills/evalmath-mechinterp-power/scripts/preflight.py"
          python -m unittest discover -s mechinterp/dark_fiber_gyms/tests -p 'fsi04_source_checks.py' -v
      - name: Generate independent MRV S4 development roots, never score a model
        run: |
          python -m mechinterp.dark_fiber_gyms.fsi04.roster \
            --out-dir /tmp/fsi04_roster --smoke --max-attempts 2000
          python - <<'PY'
          import json
          m=json.load(open('/tmp/fsi04_roster/development_manifest.json'))
          assert m['counts']=={'S4_stalled':4,'WB-Prop':2}
          assert m['historical_rep_case_ids_checked']==120
          assert m['full_automorphism_against_loopscope02']
          assert m['ARG03_protected_test']=='untouched'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bpd-fsi04-fresh-unscored-development-roster-smoke
          path: /tmp/fsi04_roster/*
          if-no-files-found: error
