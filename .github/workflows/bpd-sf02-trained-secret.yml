name: BPD-SF02 trained secret circuit source and native parity

on:
  pull_request:
    paths:
      - "mechinterp/bpd/theory/sf02_secret_circuit/**"
      - ".github/workflows/bpd-sf02-trained-secret.yml"
  push:
    branches:
      - "research/bpd-sf02-*"
    paths:
      - "mechinterp/bpd/theory/sf02_secret_circuit/**"
      - ".github/workflows/bpd-sf02-trained-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-source-and-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU dependencies
        run: python -m pip install "torch==2.5.1" "numpy>=1.26"
      - name: Execute engineering tests on excluded seeds
        run: python -m unittest discover -s mechinterp/bpd/theory/sf02_secret_circuit/tests -v
      - name: Execute actual native BPDModel two-pass and swap parity
        run: python -m mechinterp.bpd.theory.sf02_secret_circuit.native_parity
      - name: Bytecode
        run: python -m compileall -q mechinterp/bpd/theory/sf02_secret_circuit
