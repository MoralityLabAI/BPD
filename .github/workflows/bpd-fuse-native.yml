name: BPD FUSE-09 native trainer and capacity gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/fused_residual/**'
      - 'mechinterp/bpd/trainer.py'
      - 'mechinterp/bpd/components.py'
      - '.github/workflows/bpd-fuse-native.yml'
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==8.4.2
      - name: Native trainer parity gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse06_native --output "$RUNNER_TEMP/fuse06_native.json"
      - name: Check exact admission oracle
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse07 --output "$RUNNER_TEMP/fuse07_oracle.json"
      - name: FUSE-08 cross-scope primal lifecycle and stress
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse08_pool --output "$RUNNER_TEMP/fuse08_pool.json"
      - name: FUSE-08 binding-cap native trainer gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse08_native --output "$RUNNER_TEMP/fuse08_native.json"
      - name: FUSE-09 mask-only primal stress
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse09_pool --output "$RUNNER_TEMP/fuse09_pool.json"
      - name: FUSE-09 small native PGD gradient gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse09_native --stage small --output "$RUNNER_TEMP/fuse09_small.json"
      - name: FUSE-10 calibration residual gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse10_native --output "$RUNNER_TEMP/fuse10_native.json"
      - name: FUSE-11 retained PGD graph gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse11_native --output "$RUNNER_TEMP/fuse11_native.json"
      - name: FUSE-12 CUDA default-off and CPU guard gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse12_cuda --cpu-guard-only --output "$RUNNER_TEMP/fuse12_cpu_guard.json"
      - name: FUSE-13 Stage 0 receipt audit
        run: python -m mechinterp.bpd.experiments.fused_residual.fuse13_precision_gym --output "$RUNNER_TEMP/fuse13_audit.json"
      - name: FUSE-13 Stage A native mixed-precision calibration (CPU)
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse13_stage_a --device cpu --output "$RUNNER_TEMP/fuse13_stage_a_cpu.json"
      - name: FUSE-13 Stage B/C precision storage and guards (CPU)
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse13_precision --device cpu --output "$RUNNER_TEMP/fuse13_stage_bc_cpu.json"
      - name: FUSE-14 standalone frozen projection probe (CPU)
        run: python -m mechinterp.bpd.experiments.fused_residual.fuse14_projection_probe --device cpu > "$RUNNER_TEMP/fuse14_probe_cpu.json"
      - name: FUSE-14 Stages A-E trainer integration and guards (CPU)
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse14_suite --device cpu --output "$RUNNER_TEMP/fuse14_suite_cpu.json"
      - name: Replay pinned INK06 source receipt
        run: |
          python -m mechinterp.bpd.experiments.inkling_component_flow.run_source_audit \
            --check mechinterp/bpd/experiments/inkling_component_flow/evidence/source_fixture.json \
            --out "$RUNNER_TEMP/ink06_source_replay.json"
      - name: Retain native gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse06-native-trainer
          path: |
            ${{ runner.temp }}/fuse06_native.json
            ${{ runner.temp }}/fuse07_oracle.json
            ${{ runner.temp }}/fuse08_pool.json
            ${{ runner.temp }}/fuse08_native.json
            ${{ runner.temp }}/fuse09_pool.json
            ${{ runner.temp }}/fuse09_small.json
            ${{ runner.temp }}/fuse10_native.json
            ${{ runner.temp }}/fuse11_native.json
            ${{ runner.temp }}/fuse12_cpu_guard.json
            ${{ runner.temp }}/fuse13_audit.json
            ${{ runner.temp }}/fuse13_stage_a_cpu.json
            ${{ runner.temp }}/fuse13_stage_bc_cpu.json
            ${{ runner.temp }}/fuse14_probe_cpu.json
            ${{ runner.temp }}/fuse14_suite_cpu.json
            ${{ runner.temp }}/ink06_source_replay.json
          if-no-files-found: warn
          retention-days: 90

  wide-cpu:
    # Expensive experiment matrix is opt-in after this registered campaign.
    # The full numerical native gate still runs on each PR revision.
    if: github.event_name == 'workflow_dispatch'
    needs: native-cpu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 512
            passes: 6
            cap: binding
            regime: closed_loop
          - width: 512
            passes: 6
            cap: full
            regime: closed_loop
          - width: 512
            passes: 12
            cap: binding
            regime: closed_loop
          - width: 512
            passes: 12
            cap: full
            regime: closed_loop
          - width: 1024
            passes: 6
            cap: binding
            regime: closed_loop
          - width: 1024
            passes: 6
            cap: full
            regime: closed_loop
          - width: 1024
            passes: 12
            cap: binding
            regime: closed_loop
          - width: 1024
            passes: 12
            cap: full
            regime: closed_loop
          - width: 512
            passes: 12
            cap: binding
            regime: clean_window
          - width: 1024
            passes: 12
            cap: binding
            regime: clean_window
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: FUSE-09 wide matched trainer
        run: |
          python -m mechinterp.bpd.experiments.fused_residual.validate_fuse09_native \
            --stage wide --width ${{ matrix.width }} --passes ${{ matrix.passes }} \
            --cap ${{ matrix.cap }} --regime ${{ matrix.regime }} --output "$RUNNER_TEMP/fuse09_wide.json"
      - name: Retain wide receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse09-wide-${{ matrix.width }}-${{ matrix.passes }}-${{ matrix.cap }}-${{ matrix.regime }}
          path: ${{ runner.temp }}/fuse09_wide.json
          if-no-files-found: warn
          retention-days: 90
