name: BPD FUSE-06 native trainer gate
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/fused_residual/**'
      - 'mechinterp/bpd/trainer.py'
      - 'mechinterp/bpd/components.py'
      - '.github/workflows/bpd-fuse-native.yml'
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==2.3.5 pytest==8.4.2
      - name: Native trainer parity gate
        run: python -m mechinterp.bpd.experiments.fused_residual.validate_fuse06_native --output "$RUNNER_TEMP/fuse06_native.json"
      - name: Retain native gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuse06-native-trainer
          path: ${{ runner.temp }}/fuse06_native.json
          if-no-files-found: warn
          retention-days: 90
