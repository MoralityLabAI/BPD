name: BPD-NC-09 source-locked cross-task development
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc09/EXECUTE_LOCK.json'
      - 'mechinterp/bpd/experiments/nc09/core.py'
      - 'mechinterp/bpd/experiments/nc09/experiment.py'
      - 'mechinterp/bpd/experiments/nc09/aggregate.py'
      - 'mechinterp/bpd/experiments/nc09/preflight_manifest.py'
      - 'mechinterp/bpd/experiments/nc09/test_experiment.py'
      - 'mechinterp/bpd/experiments/nc09/PROTOCOL.md'
      - '.github/workflows/bpd-nc09-development.yml'
  workflow_dispatch:

jobs:
  verify-source-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require precise pre-data Git blob/source seal
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('mechinterp/bpd/experiments/nc09')
          lock=json.loads((p/'EXECUTE_LOCK.json').read_text())
          assert lock['source_only_protocol_commit']=='22e00fc22cdd5e3403d936294232bcfc051aa2e2'
          assert lock['development_seeds']==list(range(900,908))
          assert lock['scientific_confirmation']=='SEALED'
          for name,expected in sorted(lock['locked_git_blobs'].items()):
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==expected,(name,actual,expected)
              print('SOURCE_LOCK',name,actual)
          PY
      - name: Install pinned CPU package versions
        run: python -m pip install 'torch==2.5.1' 'numpy==2.5.5' 'pytest==9.2.0'
      - name: Repeat independent source regression suite at exact execution lock
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc09
          python -m pytest -q mechinterp/bpd/experiments/nc09/test_experiment.py

  development-model-roots:
    needs: verify-source-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact CPU toolchain
        run: python -m pip install 'torch==2.5.1' 'numpy==2.5.5' 'pytest==9.2.0'
      - name: Re-verify registered experiment and dependency blobs before training
        run: |
          python - <<'PY'
          import json,subprocess
          p='mechinterp/bpd/experiments/nc09/EXECUTE_LOCK.json'
          lock=json.load(open(p))
          for name,expected in sorted(lock['locked_git_blobs'].items()):
              actual=subprocess.check_output(['git','hash-object',name],text=True).strip()
              assert actual==expected,(name,actual,expected)
          print('REGISTERED_SOURCE_ONLY_LOCK_PASS')
          PY
      - name: First eight completely fresh independently trained joint-task model roots
        run: |
          mkdir -p /tmp/nc09_development
          for seed in 900 901 902 903 904 905 906 907; do
            python -m mechinterp.bpd.experiments.nc09.experiment \
              --seed "$seed" --steps 640 --discovery-size 1024 \
              --evaluation-size 1024 --proposals 2048 \
              --out "/tmp/nc09_development/nc09_root_${seed}.json"
          done
          python -m mechinterp.bpd.experiments.nc09.aggregate \
            --directory /tmp/nc09_development \
            --out /tmp/nc09_development/NC09_ENGINEERING_SUMMARY.json
          python -m mechinterp.bpd.experiments.nc09.preflight_manifest \
            --directory /tmp/nc09_development \
            --out /tmp/nc09_development/NC09_EVALMATH_MANIFEST.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nc09_development/NC09_ENGINEERING_SUMMARY.json'))
          assert r['independent_model_roots']==8
          assert r['scientific_status']=='NOT_CONFIRMATORY'
          assert r['development_resolution'] in ('ENGINEERING_CROSS_TASK_TRANSFER',
                                                  'ENGINEERING_NULL_OR_INELIGIBLE')
          print('FIRST_REGISTERED_SCIENTIFIC_VERDICT',r['development_resolution'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc09-original-eight-root-cross-task-receipts
          path: /tmp/nc09_development/
          if-no-files-found: warn

  evalmath-strict-hold:
    needs: development-model-roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/EvalMath
          ref: 6d9c28dbe8e4c42b3fba76ae7adb84aed9f0921a
          path: evalmath-pinned
      - uses: actions/download-artifact@v4
        with:
          name: nc09-original-eight-root-cross-task-receipts
          path: /tmp/nc09_pilot
      - name: Require pinned EvalMath and strictly enforce confirmation hold
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','-C','evalmath-pinned','rev-parse','HEAD'],text=True).strip()=='6d9c28dbe8e4c42b3fba76ae7adb84aed9f0921a'
          manifest=json.load(open('/tmp/nc09_pilot/NC09_EVALMATH_MANIFEST.json'))
          path=Path('/tmp/nc09_pilot/NC09_STRICT_PREFLIGHT_INPUT.json')
          if 'spec' in manifest:
              path.write_text(json.dumps(manifest['spec'],indent=2)+'\n')
              print('STRICT_INPUT_READY')
          else:
              print('SOURCE_ELIGIBILITY_HOLD',manifest['status'])
          PY
          if [ -f /tmp/nc09_pilot/NC09_STRICT_PREFLIGHT_INPUT.json ]; then
            set +e
            python evalmath-pinned/skills/evalmath-mechinterp-power/scripts/preflight.py \
              --pilot /tmp/nc09_pilot/NC09_STRICT_PREFLIGHT_INPUT.json \
              --out /tmp/nc09_pilot/NC09_STRICT_PREFLIGHT.json --strict
            status=$?
            set -e
            test "$status" -eq 2
            python - <<'PY'
          import json
          f=json.load(open('/tmp/nc09_pilot/NC09_STRICT_PREFLIGHT.json'))
          assert f['decision']=='REDESIGN_OR_PILOT_ONLY'
          assert 'sham_quantile_uncalibrated' in f['reasons']
          print('CONFIRMATION_HOLD',f['decision'],f['reasons'])
          PY
          else
            python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('/tmp/nc09_pilot/NC09_EVALMATH_MANIFEST.json'))
          Path('/tmp/nc09_pilot/NC09_STRICT_PREFLIGHT.json').write_text(
              json.dumps({'decision':'REDESIGN_OR_PILOT_ONLY',
                          'reason':m['status'],
                          'confirmation':'SEALED'},indent=2)+'\n')
          print('CONFIRMATION_HOLD_SOURCE_ADMISSION',m['status'])
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc09-strict-evalmath-confirmation-hold
          path: /tmp/nc09_pilot/NC09_*PREFLIGHT*.json
          if-no-files-found: warn
