name: BPD-SUB-03 registered strong-null source and excluded smoke

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub03/**'
      - '.github/workflows/bpd-sub03-source.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sub03/**'
      - '.github/workflows/bpd-sub03-source.yml'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require SUB-03 prospective protocol and frozen earlier sources
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 6342376f0f5c2d34e3868bbbc332d2ca4756dd8f HEAD
          git show 6342376f0f5c2d34e3868bbbc332d2ca4756dd8f:mechinterp/bpd/experiments/sub03/PROTOCOL.md > /tmp/sub03-frozen.md
          cmp /tmp/sub03-frozen.md mechinterp/bpd/experiments/sub03/PROTOCOL.md
          git diff --exit-code 3b73b45c40303ab7d4187dbc133d7b48ae7c9b8b HEAD -- \
            mechinterp/bpd/experiments/sub01/experiment.py \
            mechinterp/bpd/experiments/sub02/experiment.py
      - name: Install pinned CPU stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==8.3.5'
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate exact-spectrum null construction and excluded smoke
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub03
          python -m pytest -q mechinterp/bpd/experiments/sub03/test_experiment.py
          python -m mechinterp.bpd.experiments.sub03.experiment --phase smoke --out /tmp/sub03-excluded-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-sub03-excluded-smoke
          path: /tmp/sub03-excluded-smoke.json
