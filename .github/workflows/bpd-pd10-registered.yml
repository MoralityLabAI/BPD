name: BPD-PD-10 first registered cold-sigma pair-mixing cohort

on:
  push:
    paths:
      - 'mechinterp/bpd/theory/pd10/EXECUTE_LOCK.json'

permissions:
  contents: read

jobs:
  first-registered-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable PD10 protocol, seeds, schedules and imported source
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('mechinterp/bpd/theory/pd10')
          config=json.loads((root/'CONFIG.json').read_text())
          lock=json.loads((root/'EXECUTE_LOCK.json').read_text())
          assert config['study_id']==lock['study_id']=='BPD-PD-10'
          assert lock['execution']=='first_registered_full_cohort'
          assert len(config['seeds'])==lock['seeds']==24
          assert len(config['arms'])==lock['arms_per_seed']==6
          assert config['scoring']['primary_arm']=='cold015'
          assert config['scoring']['primary_control']=='anneal060_030_015'
          sha=lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          files=[str(root / p) for p in ('CONFIG.json','PROTOCOL.md','experiment.py','test_experiment.py')]
          files+=['mechinterp/bpd/theory/pd09/experiment.py',
                  'mechinterp/bpd/theory/pd06/experiment.py',
                  'mechinterp/bpd/components.py',
                  'mechinterp/bpd/config.py']
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--',*files],check=True)
          print('BPD-PD-10 exact research source lock:',sha)
          PY
      - name: Install pinned CPU PyTorch and pytest
        run: |
          python -m pip install --disable-pip-version-check pytest numpy
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recheck excluded-seed QR and true-Q-init stress isolation
        run: python -m pytest -q mechinterp/bpd/theory/pd10/test_experiment.py
      - name: Execute all 24 seeds and six registered arms
        run: python -m mechinterp.bpd.theory.pd10.experiment --out /tmp/bpd-pd10-first-run.json
      - name: Verify original 144-arm complete scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/bpd-pd10-first-run.json').read_text())
          c=json.loads(Path('mechinterp/bpd/theory/pd10/CONFIG.json').read_text())
          assert receipt['study_id']=='BPD-PD-10'
          assert receipt['summary']['registered']
          assert receipt['summary']['seed_count']==24
          assert len(receipt['arms'])==144
          assert len({(r['seed'],r['arm']) for r in receipt['arms']})==144
          assert {r['seed'] for r in receipt['arms']}==set(c['seeds'])
          assert {r['arm'] for r in receipt['arms']}=={a['key'] for a in c['arms']}
          assert len({r['source_rotation_sha256'] for r in receipt['arms']})==24
          assert all(len(r['heldout']['per_family'])==6 for r in receipt['arms'])
          assert all(all(m['mask_exact_binary'] for m in r['heldout']['per_family'].values())
                     for r in receipt['arms'])
          assert all(r['first_trainable_gradient_norm']>0 and
                     r['raw_matrix_parameter_update_norm']>0
                     for r in receipt['arms'])
          assert all(not r['used_cardinality_labels'] for r in receipt['arms']
                     if r['arm']!='count_supervised_positive')
          assert all(not r['starting_from_true_Q'] for r in receipt['arms']
                     if r['arm']!='privileged_pairmix015')
          assert all(r['starting_from_true_Q'] for r in receipt['arms']
                     if r['arm']=='privileged_pairmix015')
          print('Registered PD10 scientific PASS/FAIL:',
                receipt['summary']['registered_primary_passed'])
          print('Seed success by arm:',receipt['summary']['success_by_arm'])
          print('Exact two-sided McNemar p:',receipt['summary']['McNemar_exact_two_sided_p'])
          PY
      - name: Archive unmodified first-run 144-arm receipt including scientific failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-pd10-first-run-${{ github.run_id }}
          path: /tmp/bpd-pd10-first-run.json
          retention-days: 60
          if-no-files-found: warn
