name: RT-BPD-02 CPU theory and synthetic replay

on:
  pull_request:
    paths:
      - "mechinterp/bpd/theory/rtbpd02/**"
      - ".github/workflows/rtbpd02-source-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weighted-rank-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mechinterp/bpd/theory/rtbpd02
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only numerical dependency
        run: python -m pip install --disable-pip-version-check "numpy==1.26.4"
      - name: Check mathematical fixtures, custody logic and independent root reduction
        run: python -m unittest discover -s mechinterp/bpd/theory/rtbpd02 -p 'test_*.py' -v
      - name: Reproduce registered synthetic development receipts
        run: python mechinterp/bpd/theory/rtbpd02/synthetic_gym.py --out "$RUNNER_TEMP/rtbpd02"
      - uses: actions/upload-artifact@v4
        with:
          name: rtbpd02-synthetic-development
          path: ${{ runner.temp }}/rtbpd02/*.json
          if-no-files-found: error
          retention-days: 14
