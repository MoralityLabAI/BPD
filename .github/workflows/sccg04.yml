name: SCCG04 support proposal pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sccg01/support_gym.py'
      - 'mechinterp/bpd/experiments/sccg01/SUPPORT_GYM_PROTOCOL.md'
      - '.github/workflows/sccg04.yml'
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5
      - run: python mechinterp/bpd/experiments/sccg01/support_gym.py --output sccg04_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: sccg04-receipt
          path: sccg04_receipt.json
