name: BPD Inkling reader source checks
on:
  push:
    branches:
      - research/inkling-cross-loop-causal-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/**"
      - ".github/workflows/bpd-inkling-reader-source.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/**"
      - ".github/workflows/bpd-inkling-reader-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source-only unittest fixtures
        run: python -m unittest discover -s mechinterp/bpd/experiments/inkling_reader_v0 -p 'test_reader_probe.py' -v
