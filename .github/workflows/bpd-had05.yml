name: HAD-05 native adapter and exact receipts

on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/hadamard_population/**'
      - 'mechinterp/bpd/components.py'
      - 'mechinterp/bpd/config.py'
      - '.github/workflows/bpd-had05.yml'
  push:
    branches:
      - 'research/had05-ldt-population-20261126'
    paths:
      - 'mechinterp/bpd/experiments/hadamard_population/**'
      - '.github/workflows/bpd-had05.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused CPU dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.2.0
          python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Check native execution and finite regressions
        run: |
          python -m pytest -q \
            mechinterp/bpd/experiments/hadamard_population/test_native_adapter.py \
            mechinterp/bpd/experiments/hadamard_population/test_math_bounds.py \
            mechinterp/bpd/experiments/hadamard_population/test_budget_edges.py \
            mechinterp/bpd/experiments/hadamard_population/test_receipt_checks.py \
            --junitxml=/tmp/had05-tests.xml
      - name: Audit saved development receipts
        run: |
          python mechinterp/bpd/experiments/hadamard_population/verify_replay.py \
            --out /tmp/had05-receipt-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: had05-engineering-verification
          path: |
            /tmp/had05-tests.xml
            /tmp/had05-receipt-audit.json
