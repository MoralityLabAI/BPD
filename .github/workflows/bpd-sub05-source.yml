name: BPD-SUB-05 registered source math and excluded smoke

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub05/**'
      - '.github/workflows/bpd-sub05-source.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sub05/**'
      - '.github/workflows/bpd-sub05-source.yml'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check first protocol immutable, imported original physical sources unchanged
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 184ab0517c56850eec0b64ac54c92168662c4e2f HEAD
          git show 184ab0517c56850eec0b64ac54c92168662c4e2f:mechinterp/bpd/experiments/sub05/PROTOCOL.md > /tmp/sub05-registered.md
          cmp /tmp/sub05-registered.md mechinterp/bpd/experiments/sub05/PROTOCOL.md
          git diff --exit-code e4fcdc0a0cbf6964c45a90ef8a9801497ba261f9 HEAD -- \
            mechinterp/bpd/experiments/sub01/experiment.py \
            mechinterp/bpd/experiments/sub02/experiment.py \
            mechinterp/bpd/experiments/sub03/experiment.py \
            mechinterp/bpd/experiments/sub04/experiment.py
      - name: Install source-locked CPU stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==8.3.5'
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact moving-fiber checks, QR fit and excluded root
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub05
          python -m pytest -q mechinterp/bpd/experiments/sub05/test_experiment.py
          python -m mechinterp.bpd.experiments.sub05.experiment --phase smoke \
            --output /tmp/sub05-excluded-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-sub05-excluded-smoke
          path: /tmp/sub05-excluded-smoke.json
