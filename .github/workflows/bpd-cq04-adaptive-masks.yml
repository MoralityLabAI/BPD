name: BPD-CQ-04 trained adaptive-mask pilot and native parity
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/theory/cq04_adaptive_masks/**'
      - '.github/workflows/bpd-cq04-adaptive-masks.yml'
  workflow_dispatch:
jobs:
  cpu-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26'
      - name: Engineer tests and native masked PassMaskSchedule
        run: python -m unittest discover -s mechinterp/bpd/theory/cq04_adaptive_masks/tests -v
      - name: Source-locked independent eight-root replay
        run: python -m mechinterp.bpd.theory.cq04_adaptive_masks.reference --backend independent --check --out /tmp/cq04_independent_hosted.json
      - name: Native BPDModel/TiedComponentLinear eight-root parity
        run: python -m mechinterp.bpd.theory.cq04_adaptive_masks.reference --backend native --check --out /tmp/cq04_native_hosted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cq04-independent-native-receipts
          path: |
            /tmp/cq04_independent_hosted.json
            /tmp/cq04_native_hosted.json
