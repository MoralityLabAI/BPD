name: BPD-NC-08 source-only pass-rank knapsack admission

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/nc08/**'
      - '.github/workflows/bpd-nc08-preflight.yml'
      - '.github/workflows/bpd-nc08-development.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc08/**'
      - '.github/workflows/bpd-nc08-preflight.yml'
      - '.github/workflows/bpd-nc08-development.yml'

permissions:
  contents: read

jobs:
  excluded-root-799:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen NC08 preregistration predates source/model code
        run: |
          set -euo pipefail
          git cat-file -e 27e09f396392f9ba0c8a169b84aea3712ed4c6cc^{commit}
          git merge-base --is-ancestor 27e09f396392f9ba0c8a169b84aea3712ed4c6cc HEAD
          git show 27e09f396392f9ba0c8a169b84aea3712ed4c6cc:mechinterp/bpd/experiments/nc08/PROTOCOL.md > /tmp/nc08-original-protocol.md
          cmp /tmp/nc08-original-protocol.md mechinterp/bpd/experiments/nc08/PROTOCOL.md
      - name: Install compatible CPU PyTorch and tests
        run: |
          python -m pip install --disable-pip-version-check pytest 'numpy>=1.26' scipy==1.14.1
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Excluded 799 source-only rank DP, native BPD sham and registered logic
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc08
          python -m pytest -q mechinterp/bpd/experiments/nc08/test_experiment.py mechinterp/bpd/experiments/nc08/test_aggregate.py

  exact-slot-budget-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Lean 4.19 kernel
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.19.0-linux/bin' >> "$GITHUB_PATH"
      - name: Kernel check the frozen passwise rank budget
        run: |
          set -euo pipefail
          lean mechinterp/bpd/experiments/nc08/PasswiseBudget.lean | tee /tmp/nc08-lean.txt
          grep 'BPD.NC08.all_frozen_candidate_budgets_below_flat_four' /tmp/nc08-lean.txt
          grep 'BPD.NC08.rank_twelve_saves_four_physical_slots' /tmp/nc08-lean.txt
          if grep -E 'sorryAx|ofReduceBool' /tmp/nc08-lean.txt; then exit 1; fi
