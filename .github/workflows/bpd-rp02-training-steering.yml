name: BPD RP02 training steering replay

on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/training_steering/**'
      - 'mechinterp/bpd/components.py'
      - 'mechinterp/bpd/config.py'
      - '.github/workflows/bpd-rp02-training-steering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  training-contract-and-receipt-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r mechinterp/bpd/experiments/training_steering/requirements.txt
      - name: Check training, data and causal treatment contracts
        run: python -m unittest discover -s mechinterp/bpd/experiments/training_steering -t . -p 'test_*.py' -v
      - name: Replay preserved engineering checkpoints
        run: >-
          python -m mechinterp.bpd.experiments.training_steering.audit
          mechinterp/bpd/experiments/training_steering/results/smoke
          --skip-current-source --out /tmp/rp02_smoke_audit.json
      - name: Replay the published development checkpoints
        if: hashFiles('mechinterp/bpd/experiments/training_steering/results/development/summary.json') != ''
        run: >-
          python -m mechinterp.bpd.experiments.training_steering.audit
          mechinterp/bpd/experiments/training_steering/results/development
          --out /tmp/rp02_development_audit.json
