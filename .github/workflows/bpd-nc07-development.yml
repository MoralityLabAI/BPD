name: BPD-NC-07 first registered adaptive-rank development on eight new roots

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/nc07/EXECUTE_LOCK.json'

permissions:
  contents: read

jobs:
  original-eight-root-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preregistration, exactly eight roots and unchanged experiment source
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('mechinterp/bpd/experiments/nc07')
          lock=json.loads((root/'EXECUTE_LOCK.json').read_text())
          assert lock['study']=='BPD-NC-07'
          assert lock['execution']=='first_original_eight_root_development'
          assert lock['roots']==list(range(700,708))
          assert lock['excluded_smoke_seed']==699
          assert lock['gradient_discovery']==1024 and lock['rank_selection']==512
          assert lock['final_heldout']==1024 and lock['training_steps']==384
          assert lock['frozen_ranks']==[2,3,4,6]
          assert lock['shams']==8 and lock['sham_proposals']==1024
          sha=lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',
            'c798a5b50ee78a0b430a69dfe34a474b89919b37','HEAD'],check=True)
          protected=[str(root/f) for f in (
            'PROTOCOL.md','THEORY.md','experiment.py','aggregate.py',
            'test_experiment.py','test_aggregate.py'
          )]+[
            'mechinterp/bpd/experiments/nc02/experiment.py',
            'mechinterp/bpd/experiments/nc03/experiment.py',
            'mechinterp/bpd/experiments/nc04/experiment.py',
            'mechinterp/bpd/experiments/nc05/experiment.py',
            'mechinterp/bpd/experiments/nc06/experiment.py',
            'mechinterp/bpd/components.py',
            'mechinterp/bpd/config.py'
          ]
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--',*protected],check=True)
          print('NC07 original eight-root source lock verified',sha)
          PY
      - name: Install pinned numerical and source-audit dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest 'numpy>=1.26' scipy==1.14.1
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify excluded root 699, rank criteria and root bootstrap
        run: |
          python -m pytest -q mechinterp/bpd/experiments/nc07/test_experiment.py mechinterp/bpd/experiments/nc07/test_aggregate.py
      - name: Train eight new 20D four-pass models and run frozen selector and shams
        run: |
          set -euo pipefail
          mkdir -p /tmp/nc07-original
          for root in 700 701 702 703 704 705 706 707; do
            python -m mechinterp.bpd.experiments.nc07.experiment \
              --seed "$root" --steps 384 --discovery 1024 \
              --selection 512 --heldout 1024 \
              --proposals 1024 --shams 8 \
              --out "/tmp/nc07-original/nc07_root_$root.json"
          done
      - name: Aggregate source-registered full eight-root decision
        run: |
          python -m mechinterp.bpd.experiments.nc07.aggregate \
            --root-dir /tmp/nc07-original \
            --out /tmp/nc07-original/NC07_ORIGINAL_DEVELOPMENT_SUMMARY.json
      - name: Independent admitted-source and selected-rank original receipt audit
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/nc07-original')
          summary=json.loads((root/'NC07_ORIGINAL_DEVELOPMENT_SUMMARY.json').read_text())
          assert summary['study']=='BPD-NC-07'
          assert summary['phase']=='DEVELOPMENT'
          assert summary['evidence_class']=='ENGINEERING_ONLY'
          assert summary['independent_model_roots']==8
          assert summary['confirmed_scientific_result'] is False
          assert summary['calibration_roots_evaluated']==0
          assert summary['confirmation_roots_evaluated']==0
          assert summary['registered_verdict'] in (
              'ENGINEERING_POSITIVE','ENGINEERING_NULL_OR_INELIGIBLE'
          )
          assert len(summary['per_root'])==8
          assert {r['root'] for r in summary['per_root']}==set(range(700,708))
          for seed in range(700,708):
            filename=root/('nc07_root_%d.json'%seed)
            source=json.loads(filename.read_text())
            assert source['study']=='BPD-NC-07' and source['phase']=='DEVELOPMENT'
            assert source['root']==seed and source['training']['steps']==384
            assert source['split_sizes']=={
                'train':2048,'derivative_discovery':1024,
                'rank_selection':512,'final_heldout':1024
            }
            assert source['protocol_sha256']==summary['protocol_sha256']
            chosen=source['selected_rank']
            feasible=next((r for r in (2,3,4,6)
                    if source['selector_by_rank'][str(r)]['eligible']),None)
            assert chosen==feasible
            assert source['full_mask_closure']['passed']
            assert all(len(source['selector_by_rank'][str(r)]['spectrum'])==4
                       for r in (2,3,4,6))
            if source['eligible']:
                assert chosen in (2,3,4,6)
                assert source['selected_sham_admission']['selected']==8
                assert source['selected_gauge']['max_rotated_logit_error']<=5e-5
                assert source['selected_gauge']['physical_operator_rel_error']<=1e-4
                assert len(source['sham_heldout_nll_nats'])==8
                assert all(source['heldout'][k] is not None
                   for k in ('selected','fixed_rank3','fixed_rank4'))
            print('source root',seed,'sha256',hashlib.sha256(filename.read_bytes()).hexdigest(),
                  'selected',chosen,'eligible',source['eligible'])
          print('Original NC07 engineering verdict:',summary['registered_verdict'])
          print('Original NC07 gates:',summary['gates'])
          PY
      - name: Archive immutable first eight model-root JSONs and decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-nc07-original-eight-root-development-${{ github.run_id }}
          path: /tmp/nc07-original/
          retention-days: 90
          if-no-files-found: warn
