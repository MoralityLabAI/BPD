name: BPD-SF04 source-binding engineering and native parity
on:
  push:
    branches:
      - "research/bpd-sf04-*"
    paths:
      - "mechinterp/bpd/theory/sf04_source_binding/**"
      - ".github/workflows/bpd-sf04-source-binding.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/theory/sf04_source_binding/**"
      - ".github/workflows/bpd-sf04-source-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install "torch==2.5.1"
      - name: Validate source swap labels and exact projected writes
        run: python -m unittest discover -s mechinterp/bpd/theory/sf04_source_binding/tests -v
      - name: Verify native BPDModel/TiedComponentLinear triple-pass and donor write
        run: python -m mechinterp.bpd.theory.sf04_source_binding.native_parity
      - name: Bytecode check
        run: python -m compileall -q mechinterp/bpd/theory/sf04_source_binding
