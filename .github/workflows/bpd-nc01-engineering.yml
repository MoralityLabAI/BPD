name: BPD-NC-01 recurrent neuron communities (engineering only)
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc01/**'
      - '.github/workflows/bpd-nc01-engineering.yml'
  workflow_dispatch:

jobs:
  cpu-source-and-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact CPU toolchain for engineer checks
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Static Python compilation
        run: python -m compileall -q mechinterp/bpd/experiments/nc01
      - name: Registered algebra, split and causal parity tests
        run: python -m pytest -q mechinterp/bpd/experiments/nc01/test_experiment.py
      - name: One-root source-registered engineering smoke, no confirmation
        run: |
          python -m mechinterp.bpd.experiments.nc01.experiment \
            --seed 100 --steps 64 --discovery-size 256 --evaluation-size 128 \
            --out /tmp/bpd_nc01_engineering.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/bpd_nc01_engineering.json'))
          for name, data in r['bases'].items():
              print(name, data['status'], 'groups', data.get('detected_communities', 0), 'parity', data['closure'])
              assert data['closure']['passed'], (name, data['closure'])
          assert r['evidence_class'] == 'engineering_CPU_only'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-nc01-engineering-cpu-receipt
          path: /tmp/bpd_nc01_engineering.json
          if-no-files-found: warn
