name: BPD NC09-FC05 audit original smoke replay

on:
  push:
    branches: ['research/bpd-nc09-fc05-independent-calibration-20261118']
    paths:
      - 'mechinterp/bpd/experiments/nc09_fixed12/full_tangent_calibration_fc05/SMOKE_REPLAY_LOCK.json'

permissions:
  contents: read
  actions: read

jobs:
  original-smoke-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==9.2.0 numpy==2.3.5 scipy==1.17.0
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Check the source and original artifact lock
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('mechinterp/bpd/experiments/nc09_fixed12/full_tangent_calibration_fc05')
          lock=json.loads((root/'SMOKE_REPLAY_LOCK.json').read_text())
          manifest=root/'SOURCE_MANIFEST.json'
          assert lock['study']=='BPD-NC09-FC05'
          assert lock['original_run_id']==44317319540
          assert lock['original_artifact_id']==14433326335
          assert lock['new_models_trained']==0
          assert lock['source_manifest_sha256']==hashlib.sha256(manifest.read_bytes()).hexdigest()
          sha=lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          names=list(json.loads(manifest.read_text())['files'])+[str(manifest)]
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--',*names],check=True)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: bpd-nc09-fc05-excluded-15999-44317319540
          run-id: 44317319540
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/fc05-original-smoke
      - name: Verify exact original projector and trajectory hashes without training
        run: |
          python -m mechinterp.bpd.experiments.nc09_fixed12.full_tangent_calibration_fc05.audit_smoke_replay --root-dir /tmp/fc05-original-smoke --out /tmp/fc05-replay-result/SMOKE_REPLAY_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-nc09-fc05-smoke-replay-${{ github.run_id }}
          path: /tmp/fc05-replay-result/
          retention-days: 90
          if-no-files-found: warn
