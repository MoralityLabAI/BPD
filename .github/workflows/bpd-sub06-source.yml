name: BPD-SUB-06 prereg source, fitted-clock parity and excluded smoke

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub06/**'
      - '.github/workflows/bpd-sub06-source.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sub06/**'
      - '.github/workflows/bpd-sub06-source.yml'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require protocol first and preserve original SUB-01 through SUB-05 source
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 066761af88c5a98e48071fad07048f762c370ef4 HEAD
          git show 066761af88c5a98e48071fad07048f762c370ef4:mechinterp/bpd/experiments/sub06/PROTOCOL.md > /tmp/sub06-protocol.md
          cmp /tmp/sub06-protocol.md mechinterp/bpd/experiments/sub06/PROTOCOL.md
          git diff --exit-code 96efcef65e05552461158db252e4b8ba64175536 HEAD -- \
            mechinterp/bpd/experiments/sub01/experiment.py \
            mechinterp/bpd/experiments/sub02/experiment.py \
            mechinterp/bpd/experiments/sub03/experiment.py \
            mechinterp/bpd/experiments/sub04/experiment.py \
            mechinterp/bpd/experiments/sub05/experiment.py
      - name: Install CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==8.3.5'
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify frozen source fitting parity and excluded root
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub06
          python -m pytest -q mechinterp/bpd/experiments/sub06/test_experiment.py
          python -m mechinterp.bpd.experiments.sub06.experiment --phase smoke \
            --output /tmp/sub06-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub06-excluded-1699-smoke
          path: /tmp/sub06-smoke.json
