name: BPD-CQ-08 natural-state nuisance mediation engineering + native parity
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/theory/cq08_nuisance_mediation/**'
      - '.github/workflows/bpd-cq08-nuisance-mediation.yml'
  workflow_dispatch:
    inputs:
      phase:
        description: 'development or independent 59-world sham (confirmation sealed)'
        required: true
        type: choice
        default: development
        options: [development, sham]
jobs:
  cpu-engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU Torch
        run: |
          python -m pip install 'numpy>=1.26'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
      - name: Excluded-root unit tests and native BPDModel parity
        run: python -m unittest discover -s mechinterp/bpd/theory/cq08_nuisance_mediation/tests -v
      - name: Frozen exact-weight independent/native replay against original development receipt
        run: python -m mechinterp.bpd.theory.cq08_nuisance_mediation.checkpoint_replay --check
      - name: Hosted independent eight-root raw development receipt
        run: python -m mechinterp.bpd.theory.cq08_nuisance_mediation.experiment --phase development --backend independent --out /tmp/cq08_dev_host_independent.json
      - name: Hosted native BPDModel/TiedComponentLinear raw development receipt
        run: python -m mechinterp.bpd.theory.cq08_nuisance_mediation.experiment --phase development --backend native --out /tmp/cq08_dev_host_native.json
      - name: Cross-host retraining drift diagnostic (preserve non-bit-exact results)
        id: retrain_drift
        continue-on-error: true
        run: |
          python -m mechinterp.bpd.theory.cq08_nuisance_mediation.host_audit \
            --independent /tmp/cq08_dev_host_independent.json \
            --native /tmp/cq08_dev_host_native.json \
            --out /tmp/cq08_host_drift_audit.json
      - name: Fresh hosted independent/native backend parity is mandatory
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/cq08_host_drift_audit.json'))
          if p['backend_parity']!='PASS':
              raise SystemExit('Fresh training native/independent execution mismatch')
          print('Backend parity PASS; cross-host frozen retraining parity:',p['frozen_receipt_parity'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cq08-hosted-native-independent-drift
          if-no-files-found: warn
          path: |
            /tmp/cq08_dev_host_independent.json
            /tmp/cq08_dev_host_native.json
            /tmp/cq08_host_drift_audit.json
      - name: EvalMath strict preflight blocks without sham calibration
        run: |
          python -c "import json;from mechinterp.bpd.theory.cq08_nuisance_mediation.reference import load_frozen;open('/tmp/cq08_dev.json','w').write(json.dumps(load_frozen()))"
          set +e
          python -m mechinterp.bpd.theory.cq08_nuisance_mediation.power --development /tmp/cq08_dev.json --strict
          rc=$?
          if test "$rc" -ne 2; then echo "ERROR: expected blocked strict preflight exit 2, got $rc"; exit 1; fi
      - name: Source-locked independent 59-root sham preflight is reproducible
        run: |
          python - <<'PY'
          import json,base64,gzip,hashlib
          from pathlib import Path
          from mechinterp.bpd.theory.cq08_nuisance_mediation.reference import load_frozen
          from mechinterp.bpd.theory.cq08_nuisance_mediation.power import preflight
          p=Path('mechinterp/bpd/theory/cq08_nuisance_mediation/results')
          lock=json.loads((p/'SHAM_LOCK.json').read_text())
          raw=(p/'cq08_sham_independent.json.gz.b64').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==lock['sham_gzip_base64_sha256']
          sham=json.loads(gzip.decompress(base64.b64decode(raw)))
          now=preflight(load_frozen(),sham)
          frozen=json.loads((p/'preflight_after_59_shams.json').read_text())
          assert now==frozen, 'changed planning gate'
          assert now['decision']=='READY_FOR_CONFIRMATION'
          assert lock['confirmed_release']=='NOT RELEASED'
          print('59 independent sham roots and preflight hashes verified; confirmation sealed')
          PY
      - name: Confirm sealed or validate independently committed release (no automatic scoring)
        run: |
          if test -e mechinterp/bpd/theory/cq08_nuisance_mediation/CONFIRM_UNLOCK.json; then
            python -m mechinterp.bpd.theory.cq08_nuisance_mediation.confirmation_release --preflight
            python -m unittest discover -s mechinterp/bpd/theory/cq08_nuisance_mediation/tests -p test_confirmation_release.py -v
          else
            echo 'CQ08 confirmation is sealed'
          fi
  sham-calibration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.phase == 'sham' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install 'numpy>=1.26'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
      - name: Independent 59-world sham only (confirmation remains sealed)
        run: python -m mechinterp.bpd.theory.cq08_nuisance_mediation.reference --phase sham --backend independent --out /tmp/cq08_sham_independent.json
      - uses: actions/upload-artifact@v4
        with:
          name: cq08-59-root-independent-sham
          path: /tmp/cq08_sham_independent.json
