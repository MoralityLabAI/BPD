name: BPD Inkling native recurrent CPU pilot
on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/inkling_routing/native_model.py'
      - 'mechinterp/bpd/experiments/inkling_routing/test_native_model.py'
      - 'mechinterp/bpd/experiments/inkling_routing/run_native_dev.py'
      - 'mechinterp/bpd/experiments/inkling_routing/INK_BPD02_NATIVE_PROTOCOL.md'
      - '.github/workflows/bpd-inkling-native.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/inkling_routing/**'
      - '.github/workflows/bpd-inkling-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU torch (no GPU allocation)
        run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify native writer hooks, dose and full forward continuation
        run: python -m unittest discover -s mechinterp/bpd/experiments/inkling_routing -p 'test_native_model.py' -v
      - name: Execute source-locked development cohort
        run: python mechinterp/bpd/experiments/inkling_routing/run_native_dev.py --out "$RUNNER_TEMP/inkbpd02_native_development.json"
      - name: Verify independent deterministic replay
        run: python mechinterp/bpd/experiments/inkling_routing/run_native_dev.py --out "$RUNNER_TEMP/inkbpd02_native_development.json" --check
      - name: Archive original per-root receipts and model source digest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ink-bpd02-native-development
          path: ${{ runner.temp }}/inkbpd02_native_development.json
          if-no-files-found: warn
          retention-days: 90
