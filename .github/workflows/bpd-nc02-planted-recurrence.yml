name: BPD-NC-02 planted recurrent paths (engineering only)
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc02/**'
      - '.github/workflows/bpd-nc02-planted-recurrence.yml'
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU test dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Source syntax
        run: python -m compileall -q mechinterp/bpd/experiments/nc02
      - name: Native BPD parity, path, graph and label audit
        run: python -m pytest -q mechinterp/bpd/experiments/nc02/test_experiment.py
      - name: Registered single-root engineering smoke
        run: |
          python -m mechinterp.bpd.experiments.nc02.experiment \
            --seed 200 --steps 128 --discovery-size 256 --evaluation-size 256 \
            --out /tmp/nc02_root_200_smoke.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nc02_root_200_smoke.json'))
          assert x['phase']=='ENGINEERING'
          assert x['task_passed']
          assert x['bases']['native']['closure']['passed']
          assert x['bases']['native']['oracle_recovery']['exact_recovered_paths']==2
          assert x['bases']['native']['readout_zero_null_communities']==0
          for k,v in x['bases'].items():
              print('smoke',k,v['status'],v.get('n_communities'),v['closure'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc02-one-root-engineering-smoke
          path: /tmp/nc02_root_200_smoke.json
          if-no-files-found: warn

  development-roots:
    runs-on: ubuntu-latest
    needs: source-checks
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Eight independent source-registered engineering roots
        run: |
          mkdir -p /tmp/nc02_development
          for seed in 200 201 202 203 204 205 206 207; do
            python -m mechinterp.bpd.experiments.nc02.experiment \
              --seed "$seed" --steps 128 \
              --discovery-size 1024 --evaluation-size 1024 \
              --out "/tmp/nc02_development/nc02_root_${seed}.json"
          done
          python -m mechinterp.bpd.experiments.nc02.aggregate \
            --directory /tmp/nc02_development \
            --out /tmp/nc02_development/NC02_ENGINEERING_SUMMARY.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nc02_development/NC02_ENGINEERING_SUMMARY.json'))
          assert d['independent_training_roots']==8
          assert d['scientific_status']=='NOT_CONFIRMATORY'
          assert d['task_success_roots']==8
          assert d['bases']['native']['both_planted_paths_recovered_roots']==8
          assert d['development_resolution']=='ENGINEERING_POSITIVE_CONTROL'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc02-eight-independent-engineering-roots
          path: /tmp/nc02_development/
          if-no-files-found: warn
