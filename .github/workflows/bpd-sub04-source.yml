name: BPD-SUB-04 registered source math and excluded smoke

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub04/**'
      - '.github/workflows/bpd-sub04-source.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sub04/**'
      - '.github/workflows/bpd-sub04-source.yml'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check preregistration precedes all new source and inherited studies are unchanged
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor e329b4db54b72d15f67e9c3aef847601b0ff0d80 HEAD
          git show e329b4db54b72d15f67e9c3aef847601b0ff0d80:mechinterp/bpd/experiments/sub04/PROTOCOL.md > /tmp/sub04-original.md
          cmp /tmp/sub04-original.md mechinterp/bpd/experiments/sub04/PROTOCOL.md
          git diff --exit-code dfd25cec230c8674e05a1b8fa6c14a20d2d642b9 HEAD -- \
            mechinterp/bpd/experiments/sub01/experiment.py \
            mechinterp/bpd/experiments/sub02/experiment.py \
            mechinterp/bpd/experiments/sub03/experiment.py
      - name: Install deterministic CPU stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==8.3.5'
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Test exact quotient algebra, all-pass gauge and source smoke
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub04
          python -m pytest -q mechinterp/bpd/experiments/sub04/test_experiment.py
          python -m mechinterp.bpd.experiments.sub04.experiment --phase smoke --output /tmp/sub04-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub04-excluded-smoke
          path: /tmp/sub04-smoke.json
