name: SCCG10 MMS-TRM checks
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sccg10_mms_trm/**'
      - 'mechinterp/bpd/experiments/sccg10_native_mms/**'
      - 'mechinterp/bpd/experiments/trm_curation/**'
      - '.github/workflows/sccg10-mms-trm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mms-trm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mechinterp/bpd/experiments/training_steering_stability/requirements.txt psutil
      - run: python -m unittest discover -s mechinterp/bpd/experiments/sccg10_native_mms -p 'test_*.py' -v
      - run: python -m unittest mechinterp.bpd.experiments.sccg10_mms_trm.test_mms -v
