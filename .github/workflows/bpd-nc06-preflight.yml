name: BPD-NC-06 norm-conditioned recurrent-projector excluded-source preflight

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/nc06/**'
      - '.github/workflows/bpd-nc06-preflight.yml'
      - '.github/workflows/bpd-nc06-first-development.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc06/**'
      - '.github/workflows/bpd-nc06-preflight.yml'
      - '.github/workflows/bpd-nc06-first-development.yml'

permissions:
  contents: read

jobs:
  source-only-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify NC06 prospectively frozen protocol precedes source
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 782c545d92e2b92ece3e3bc82390d3dbea1aa97a HEAD
          git show 782c545d92e2b92ece3e3bc82390d3dbea1aa97a:mechinterp/bpd/experiments/nc06/PROTOCOL.md > /tmp/nc06-original-protocol.md
          cmp mechinterp/bpd/experiments/nc06/PROTOCOL.md /tmp/nc06-original-protocol.md
      - name: Install pinned Python 3.12 CPU packages
        run: |
          python -m pip install --disable-pip-version-check pytest 'numpy>=1.26' scipy==1.14.1
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run source math, exact shuffled ESS, and excluded 599 recurrent smoke
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc06
          python -m pytest -q mechinterp/bpd/experiments/nc06/test_experiment.py mechinterp/bpd/experiments/nc06/test_aggregate.py
      - name: Re-audit published original eight-root result and source locks
        run: python -m pytest -q mechinterp/bpd/experiments/nc06/test_published_results.py
