name: SCCG10 conditional admission reference
on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sccg10_native_mms/**'
      - '.github/workflows/sccg10.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sccg10_native_mms/**'
      - '.github/workflows/sccg10.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s mechinterp/bpd/experiments/sccg10_native_mms -p 'test_*.py' -v
