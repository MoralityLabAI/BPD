name: RLT exit frozen difficulty-transfer evaluation

on:
  push:
    branches:
      - research/rlt-exit-difficulty-transfer-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/exit_difficulty_transfer.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_exit_difficulty_transfer.py"
      - ".github/workflows/bpd-rlt-exit-transfer.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/exit_difficulty_transfer.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_exit_difficulty_transfer.py"
      - ".github/workflows/bpd-rlt-exit-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rlt-exit-frozen-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded CPU inference runtime
        run: |
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<3" "huggingface_hub>=0.24,<1"
      - name: Run unique Sudoku and frozen evaluation smoke tests
        run: python -m unittest mechinterp.bpd.experiments.inkling_reader_v0.test_exit_difficulty_transfer -v
      - name: Download immutable first learned-controller experiment
        uses: actions/download-artifact@v4
        with:
          name: bpd-rlt-learned-exit-first-dev
          path: runs/frozen_train
          run-id: 44911864342
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate frozen controller on 40 and 52 blank new roots
        if: github.event_name == 'push'
        run: |
          timeout --signal=TERM --kill-after=15s 850s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.exit_difficulty_transfer \
            --source runs/frozen_train --model gaoxin492 \
            --roots-per-panel 24 --out runs/rlt_exit_difficulty_transfer
      - name: Retain paired difficulty shift receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-rlt-frozen-difficulty-transfer
          path: runs/rlt_exit_difficulty_transfer/
          if-no-files-found: warn
          retention-days: 14
