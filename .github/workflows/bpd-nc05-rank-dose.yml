name: BPD-NC-05 rank-dose frontier (engineering only)
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc05/**'
      - '.github/workflows/bpd-nc05-rank-dose.yml'
  workflow_dispatch:

jobs:
  source-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Syntax, split, covariance, dose, wrapper and failure-gate tests
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc05
          python -m pytest -q mechinterp/bpd/experiments/nc05/test_experiment.py
      - name: One-root reduced engineering smoke
        run: |
          python -m mechinterp.bpd.experiments.nc05.experiment \
            --seed 500 --steps 384 --discovery-size 256 \
            --evaluation-size 256 --proposals 128 \
            --out /tmp/nc05_root_500_smoke.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nc05_root_500_smoke.json'))
          assert r['phase']=='ENGINEERING' and r['study']=='BPD-NC-05'
          assert r['protocol_commit']=='f7f1d2346f9d3f871049a3d03416ef7980fe90f8'
          print('task',r['task_passed'],r['contexts'])
          print('null',r['negative_controls']['zero_head'])
          for rank,doc in r['cells'].items():
              print('rank',rank,'shams',doc.get('sham_selection',{}).get('qualifying_candidates'),
                    'gains',[(g,k,list(v)) for g,rv in doc['gains'].items() for k,v in rv.items()])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc05-source-smoke
          path: /tmp/nc05_root_500_smoke.json
          if-no-files-found: warn

  development:
    runs-on: ubuntu-latest
    needs: source-and-smoke
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install registered CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Eight independent source-registered model roots and eight rank-dose cells
        run: |
          mkdir -p /tmp/nc05_results
          for seed in 500 501 502 503 504 505 506 507; do
            python -m mechinterp.bpd.experiments.nc05.experiment \
              --seed "$seed" --steps 384 --discovery-size 1024 \
              --evaluation-size 1024 --proposals 1024 \
              --out "/tmp/nc05_results/nc05_root_${seed}.json"
          done
          python -m mechinterp.bpd.experiments.nc05.aggregate \
            --directory /tmp/nc05_results \
            --out /tmp/nc05_results/NC05_RANK_DOSE_SUMMARY.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/nc05_results/NC05_RANK_DOSE_SUMMARY.json'))
          assert data['n_independent_training_roots']==8
          assert data['scientific_status']=='NOT_CONFIRMATORY'
          assert len(data['cells'])==8
          assert data['multiplicity_family']==8
          assert data['development_resolution'] in (
              'ENGINEERING_RANK_DOSE_FRONTIER','NOT_RESOLVED_OR_FAILED'
          )
          assert data['confirmation'].startswith('SEALED')
          print('frozen scientific verdict:',data['development_resolution'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc05-full-eight-root-rank-dose-receipts
          path: /tmp/nc05_results/
          if-no-files-found: warn
