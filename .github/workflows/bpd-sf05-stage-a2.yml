name: BPD-SF05 A2 finite public level-set excluded-root replay
on:
  push:
    branches:
      - "research/bpd-sf05-*"
    paths:
      - ".github/workflows/bpd-sf05-stage-a2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  excluded-finite-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PyTorch
        run: python -m pip install "torch==2.5.1"
      - name: Verify post-Stage-A hash lock
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path('mechinterp/bpd/theory/sf05_public_safe')
          lock=json.loads((p/'A2_LOCK.json').read_text())
          assert lock['stage']=='POST_STAGE_A_EXCLUDED_ROOTS_ONLY'
          assert lock['excluded_seeds']==[901,902] and lock['new_science_roots']==0
          assert subprocess.check_output(['git','hash-object',str(p/'LOCK.json')],text=True).strip()==lock['a1_lock_blob_sha']
          for path, sha in lock['files'].items():
              actual=subprocess.check_output(['git','hash-object',str(p/path)],text=True).strip()
              assert actual==sha, f'{path}: {actual} != pinned {sha}'
          print('SF05 A2 HASH LOCK VERIFIED: post-pilot engineering only')
          PY
      - name: Exact nonlinear finite-repair tests
        run: python -m unittest discover -s mechinterp/bpd/theory/sf05_public_safe/tests -v
      - name: Finite public oracle correction on excluded SF04 roots
        run: |
          python -m mechinterp.bpd.theory.sf05_public_safe.stage_a2 \
            --seeds 901 902 --shams 16 --out /tmp/sf05_stage_a2_hosted.json
      - name: Check exact current readout and preserve all nonconvergences
        shell: bash
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/sf05_stage_a2_hosted.json'))
          assert r['roots']==[901,902]
          for row in r['rows']:
              assert row['evidence_class']=='post-stage-A excluded-root development'
              assert row['authorized_eligible']>0 and row['sham_arms']==16
              for name,a in row['arms'].items():
                  assert a['max_current_readout_error']<=1e-6, name
                  assert a['public_abs_change_finite_corrected']>=0
                  print(json.dumps({'seed':row['seed'],'arm':name,
                      'auth_raw':a['authorized_recovery_raw'],
                      'auth_finite':a['authorized_recovery_finite_corrected'],
                      'public_raw':a['public_abs_change_raw'],
                      'public_finite':a['public_abs_change_finite_corrected'],
                      'converged':a['all_case_convergence'],
                      'correction_ratio':a['mean_correction_to_raw_dose'],
                      'unconverged':a['nonconverged_cases']}))
          print('SF05 A2 source-only geometry passes; SCIENTIFIC INFERENCE NOT APPLICABLE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sf05-a2-excluded-finite-public-repair
          path: /tmp/sf05_stage_a2_hosted.json
