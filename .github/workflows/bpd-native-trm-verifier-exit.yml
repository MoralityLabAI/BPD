name: Pretrained TRM native verifier-gated recurrence

on:
  push:
    branches:
      - research/inkling-cross-loop-causal-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_exit.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_native_trm_exit.py"
      - ".github/workflows/bpd-native-trm-verifier-exit.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_exit.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_native_trm_exit.py"
      - ".github/workflows/bpd-native-trm-verifier-exit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-trm-exit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<3" "huggingface_hub>=0.24,<1"
      - name: Run native recurrent state and verifier unit tests
        run: >-
          python -m unittest
          mechinterp.bpd.experiments.inkling_reader_v0.test_native_trm_exit -v
      - name: Run independent 24-root 50-blank pretrained adaptive exit comparison
        if: github.event_name == 'push'
        run: |
          timeout --signal=TERM --kill-after=15s 780s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.native_trm_exit \
            --model gaoxin492 --roots 24 --seed 20261123 --holes 50 \
            --wall-limit 600 \
            --out runs/trm_online_adaptive_50blank_20261123.json
      - name: Retain signed source-level development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-trm-native-verifier-exit
          path: runs/trm_online_adaptive_50blank_20261123.json
          if-no-files-found: warn
          retention-days: 7
