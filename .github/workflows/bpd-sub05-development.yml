name: BPD-SUB-05 first source-locked clock-bundle eight-root development

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub05/EXECUTE_LOCK.json'

permissions:
  contents: read

jobs:
  original-eight-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce original preregistration, new roots and frozen source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('mechinterp/bpd/experiments/sub05')
          lock=json.loads((root/'EXECUTE_LOCK.json').read_text())
          assert lock['study']=='BPD-SUB-05'
          assert lock['phase']=='first_original_eight_root_engineering'
          assert lock['roots']==list(range(1600,1608))
          assert lock['excluded_smoke']==1599
          assert lock['training_steps']==256
          assert lock['train']==2048 and lock['discovery']==512
          assert lock['selection']==512 and lock['heldout']==1024
          assert lock['rank']==8 and lock['bundle_optimization_steps']==120
          assert lock['optimizer_lr']==.02 and lock['output_weight']==.35
          assert lock['smooth_weight']==.50
          assert lock['time_permutations']==[
              [1,2,3,0],[2,3,0,1],[3,0,1,2],[1,0,3,2],
              [2,1,0,3],[0,2,1,3],[3,2,1,0]]
          assert lock['sham_angles']==[.2,.4,.6,.8]
          assert lock['primary_effect_floor_hidden_rms']==.015
          assert lock['future_calibration_generated'] is False
          assert lock['future_confirmation_generated'] is False
          assert lock['evalmath_commit']=='6d9c28dbe8e4c42b3fba76ae7adb84aed9f0921a'
          for sha in ('184ab0517c56850eec0b64ac54c92168662c4e2f',
                       lock['source_commit']):
              subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          for name in ('PROTOCOL.md','experiment.py','test_experiment.py',
                       'audit_original.py','THEORY.md'):
              subprocess.run(['git','diff','--exit-code',lock['source_commit'],
                  'HEAD','--',str(root/name)],check=True)
          frozen=subprocess.check_output(['git','show',
            '184ab0517c56850eec0b64ac54c92168662c4e2f:'+str(root/'PROTOCOL.md')])
          assert frozen==(root/'PROTOCOL.md').read_bytes()
          subprocess.run(['git','diff','--exit-code',
             'e4fcdc0a0cbf6964c45a90ef8a9801497ba261f9','HEAD','--',
             'mechinterp/bpd/experiments/sub01/experiment.py',
             'mechinterp/bpd/experiments/sub02/experiment.py',
             'mechinterp/bpd/experiments/sub03/experiment.py',
             'mechinterp/bpd/experiments/sub04/experiment.py'],check=True)
          print('SUB05_ORIGINAL_COHORT_SOURCE_LOCK_PASS')
          PY
      - name: Install pinned deterministic CPU stack
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'pytest==8.3.5'
          python -m pip install --disable-pip-version-check 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Structural source-only proof before exposed development models
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub05
          python -m pytest -q mechinterp/bpd/experiments/sub05/test_experiment.py
      - name: Train once all eight independent original engineering roots
        run: |
          mkdir -p /tmp/sub05
          python -m mechinterp.bpd.experiments.sub05.experiment \
            --phase development --ack-development \
            --output /tmp/sub05/original_eight.json \
            --pilot-out /tmp/sub05/evalmath_pilot.json
      - name: Independent original-receipt and all null-controls audit
        run: |
          set -euo pipefail
          python mechinterp/bpd/experiments/sub05/audit_original.py \
            --receipt /tmp/sub05/original_eight.json \
            --out /tmp/sub05/INDEPENDENT_AUDIT.json
      - name: Strict pinned EvalMath, archive decision and keep confirmation sealed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/sub05')
          s=json.loads((root/'original_eight.json').read_text())['summary']
          assert s['attempted_roots']==8
          assert s['scientific_sham_tail_calibrated'] is False
          assert s['future_confirmation']=='UNGENERATED_SEALED'
          result={
              'study':'BPD-SUB-05','phase':'ENGINEERING_ONLY',
              'original_verdict':s['verdict'],
              'eligible_roots':s['eligible_roots'],
              'independent_units':8,
              'confirmation_roots_generated':False,
              'calibration_roots_generated':False,
              'scientific_readiness':'REDESIGN_OR_PILOT_ONLY'
          }
          (root/'GATE.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          if test -f /tmp/sub05/evalmath_pilot.json; then
            curl -fLsS \
              'https://raw.githubusercontent.com/MoralityLabAI/EvalMath/6d9c28dbe8e4c42b3fba76ae7adb84aed9f0921a/skills/evalmath-mechinterp-power/scripts/preflight.py' \
              -o /tmp/sub05/evalmath_preflight_pinned.py
            set +e
            python /tmp/sub05/evalmath_preflight_pinned.py \
              --pilot /tmp/sub05/evalmath_pilot.json \
              --out /tmp/sub05/EVALMATH_PREFLIGHT.json --strict
            status=$?
            set -e
            if test "$status" -ne 2; then
              echo "Strict preflight expected REDESIGN_OR_PILOT_ONLY exit 2 for 8 roots"
              exit 1
            fi
            python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/sub05')
          j=json.loads((root/'EVALMATH_PREFLIGHT.json').read_text())
          assert j['decision']=='REDESIGN_OR_PILOT_ONLY'
          assert j['pilot_worlds']<=8
          assert j['upper_sham_quantile'] is None
          assert 'sham_quantile_uncalibrated' in j['reasons']
          gate=json.loads((root/'GATE.json').read_text())
          gate['evalmath_decision']=j['decision']
          gate['evalmath_exit_code']=2
          gate['evalmath_reasons']=j['reasons']
          (root/'GATE.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          print(json.dumps(gate,sort_keys=True))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-sub05-original-eight-clock-bundle-development
          path: /tmp/sub05/
          retention-days: 90
