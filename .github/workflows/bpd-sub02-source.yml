name: BPD-SUB-02 source math and excluded smoke

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/sub02/**'
      - '.github/workflows/bpd-sub02-source.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/sub02/**'
      - '.github/workflows/bpd-sub02-source.yml'

permissions:
  contents: read

jobs:
  source-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SUB-02 preregistration and unchanged SUB-01 source
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 0a1bda9e48715f7d9e758a5cacffe79eaf8f170e HEAD
          git show 0a1bda9e48715f7d9e758a5cacffe79eaf8f170e:mechinterp/bpd/experiments/sub02/PROTOCOL.md > /tmp/sub02-original-protocol.md
          cmp /tmp/sub02-original-protocol.md mechinterp/bpd/experiments/sub02/PROTOCOL.md
          git diff --exit-code 38dc50de5b7faf2e8dde54862c9666de65832de4 HEAD -- mechinterp/bpd/experiments/sub01/experiment.py
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy>=1.26' pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run prospective source math and excluded root
        run: |
          python -m compileall -q mechinterp/bpd/experiments/sub02
          python -m pytest -q mechinterp/bpd/experiments/sub02/test_experiment.py
          python -m mechinterp.bpd.experiments.sub02.experiment --phase smoke --output /tmp/sub02-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpd-sub02-excluded-smoke
          path: /tmp/sub02-smoke.json
