name: BPD-PD-06 first registered 32-seed rotated 4D transfer

on:
  push:
    paths:
      - 'mechinterp/bpd/theory/pd06/EXECUTE_LOCK.json'
permissions:
  contents: read

jobs:
  first-prospective-rotated-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check PD06 original registration and byte-identical locked source
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('mechinterp/bpd/theory/pd06')
          lock=json.loads((root/'EXECUTE_LOCK.json').read_text())
          cfg=json.loads((root/'CONFIG.json').read_text())
          assert cfg['study_id']==lock['study_id']=='BPD-PD-06'
          assert lock['execution']=='first_registered_full_cohort'
          assert len(cfg['seeds'])==lock['seeds']==32
          assert len(cfg['arms'])==lock['arms_per_seed']==7
          assert len(cfg['source']['eval_families'])==6
          base=lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          protected=[str(root/x) for x in ('CONFIG.json','PROTOCOL.md',
                     'experiment.py','test_experiment.py')]
          subprocess.run(['git','diff','--exit-code',base,'HEAD','--',
                          *protected],check=True)
          print('PD06 immutable model and source verified:',base)
          PY
      - name: Install pinned Torch and excluded-seed testing dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recheck excluded-seed rotation and latent-label isolation
        run: python -m pytest -q mechinterp/bpd/theory/pd06/test_experiment.py
      - name: Execute 32 independently rotated seeds across seven frozen arms
        run: python -m mechinterp.bpd.theory.pd06.experiment --out /tmp/bpd-pd06-first-run.json
      - name: Verify complete run and scientific-pass-or-fail evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/bpd-pd06-first-run.json').read_text())
          cfg=json.loads(Path('mechinterp/bpd/theory/pd06/CONFIG.json').read_text())
          assert receipt['study_id']=='BPD-PD-06'
          assert receipt['summary']['registered']
          assert len(receipt['arms'])==32*7==224
          assert receipt['summary']['seeds']==32
          assert len({(r['seed'],r['arm']) for r in receipt['arms']})==224
          assert {r['seed'] for r in receipt['arms']}==set(cfg['seeds'])
          assert {r['arm'] for r in receipt['arms']}=={a['key'] for a in cfg['arms']}
          assert all(set(r['heldout']['per_family'])==
                     set(cfg['source']['eval_families']) for r in receipt['arms'])
          assert all(all(x['execution_binary'] for x in
                      r['heldout']['per_family'].values()) for r in receipt['arms'])
          assert all(r['factor_update_norm']>0 for r in receipt['arms']
                     if not r['frozen_planted'])
          assert all(r['factor_update_norm']==0 for r in receipt['arms']
                     if r['frozen_planted'])
          assert len({r['rotation_sha256'] for r in receipt['arms']})==32
          print('Preregistered science result:',
                receipt['summary']['primary_success'])
          print('Arm successes:', receipt['summary']['success_by_arm'])
          print('McNemar p:',receipt['summary']['McNemar_exact_two_sided_p'])
          PY
      - name: Archive original full 224-arm scientific JSON, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-pd06-first-run-${{ github.run_id }}
          path: /tmp/bpd-pd06-first-run.json
          retention-days: 60
          if-no-files-found: warn
