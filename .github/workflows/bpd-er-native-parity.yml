name: BPD ER native parity
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/edge_reconstruction/**'
      - '.github/workflows/bpd-er-native-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install numpy==2.1.3
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Native vs reference response bank parity
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python mechinterp/bpd/experiments/edge_reconstruction/neural_bridge.py --native > /tmp/er13-native.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/er13-native.json'))
          assert r['native'] is True and len(r['roots']) == 8
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: er13-native-parity
          path: /tmp/er13-native.json
          if-no-files-found: error
