name: BPD-PD-02 registered first hard-gate cohort
on:
  push:
    paths:
      - 'mechinterp/bpd/theory/pd02/EXECUTE_LOCK.json'

permissions:
  contents: read

jobs:
  first-registered-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify one-time source-lock parent and registered cohort
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path('mechinterp/bpd/theory/pd02/EXECUTE_LOCK.json').read_text())
          source_commit = lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',source_commit,'HEAD'],check=True)
          frozen_paths = ['mechinterp/bpd/theory/pd02/CONFIG.json',
            'mechinterp/bpd/theory/pd02/PROTOCOL.md',
            'mechinterp/bpd/theory/pd02/experiment.py',
            'mechinterp/bpd/theory/pd02/test_experiment.py']
          subprocess.run(['git','diff','--exit-code',source_commit,'HEAD','--',
            *frozen_paths], check=True)
          cfg = json.loads(Path('mechinterp/bpd/theory/pd02/CONFIG.json').read_text())
          assert cfg['study_id'] == lock['study_id'] == 'BPD-PD-02'
          assert len(cfg['seeds']) == 24 and len(cfg['arms']) == 4
          assert lock['execution'] == 'first_registered_full_cohort'
          print('BPD-PD-02 source parent verified:', source_commit)
          PY
      - name: Install pinned CPU torch and pytest
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Excluded-seed engineering gates
        run: python -m pytest -q mechinterp/bpd/theory/pd02/test_experiment.py
      - name: Execute all predeclared 24 seeds times four arms
        run: python -m mechinterp.bpd.theory.pd02.experiment --out /tmp/bpd-pd02-results.json
      - name: Audit receipt completeness, independence and untouched selection
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          receipt=json.loads(Path('/tmp/bpd-pd02-results.json').read_text())
          assert receipt['study_id']=='BPD-PD-02'
          assert receipt['summary']['seed_count']==24
          assert len(receipt['arms'])==96
          seeds={row['seed'] for row in receipt['arms']}
          assert len(seeds)==24
          assert {row['arm'] for row in receipt['arms']}=={
            'hard_disjoint','soft_disjoint','hard_mixed','hard_frozen'}
          assert all(row['factors_bitwise_unchanged_in_stage2']
                     for row in receipt['arms'])
          assert all(row['stage1_primary_heldout']['hard_forward_exact_binary']
                     for row in receipt['arms'])
          assert len([r for r in receipt['arms'] if
            r['arm']=='hard_disjoint' and len(r['stage2_candidates'])==3])==24
          print('Registered primary gate outcome (pass or fail retained):',
                receipt['summary']['registered_primary_criterion_passed'])
          PY
      - name: Archive immutable first-run scientific receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-pd02-hard-gates-first-run-${{ github.run_id }}
          path: /tmp/bpd-pd02-results.json
          retention-days: 60
          if-no-files-found: warn
