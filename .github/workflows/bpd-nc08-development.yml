name: BPD-NC-08 first source-locked eight-root passwise rank budget development

on:
  push:
    paths:
      - 'mechinterp/bpd/experiments/nc08/EXECUTE_LOCK.json'

permissions:
  contents: read

jobs:
  original-eight-root-nc08:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen model-root roster, source admission and protected source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('mechinterp/bpd/experiments/nc08')
          lock=json.loads((root/'EXECUTE_LOCK.json').read_text())
          assert lock['study']=='BPD-NC-08'
          assert lock['execution']=='first_original_eight_root_development'
          assert lock['model_roots']==list(range(800,808))
          assert lock['excluded_engineering_seed']==799
          assert lock['training_steps']==384
          assert lock['discovery']==1024
          assert lock['selector']==512
          assert lock['final_heldout']==1024
          assert lock['budgets']==[8,10,12,14]
          assert lock['per_pass_ranks']==[2,3,4,5,6]
          assert lock['sham_proposals']==2048 and lock['shams']==8
          sha=lock['source_commit_sha']
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor',
              '27e09f396392f9ba0c8a169b84aea3712ed4c6cc','HEAD'],check=True)
          protected=[str(root/f) for f in (
              'PROTOCOL.md','THEORY.md','experiment.py','aggregate.py',
              'test_experiment.py','test_aggregate.py','PasswiseBudget.lean'
          )]+[
              'mechinterp/bpd/experiments/nc02/experiment.py',
              'mechinterp/bpd/experiments/nc03/experiment.py',
              'mechinterp/bpd/experiments/nc04/experiment.py',
              'mechinterp/bpd/experiments/nc05/experiment.py',
              'mechinterp/bpd/experiments/nc06/experiment.py',
              'mechinterp/bpd/experiments/nc07/experiment.py',
              'mechinterp/bpd/components.py',
              'mechinterp/bpd/config.py'
          ]
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--',*protected],check=True)
          print('Frozen NC08 source SHA',sha)
          PY
      - name: Install pinned CPU PyTorch numerical and test environment
        run: |
          python -m pip install --disable-pip-version-check pytest 'numpy>=1.26' scipy==1.14.1
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Re-run excluded root 799 and fixed source-only decision gates
        run: python -m pytest -q mechinterp/bpd/experiments/nc08/test_experiment.py mechinterp/bpd/experiments/nc08/test_aggregate.py
      - name: Train eight independent roots and evaluate frozen passwise rank policy
        run: |
          set -euo pipefail
          mkdir -p /tmp/nc08-original
          for root in 800 801 802 803 804 805 806 807; do
            python -m mechinterp.bpd.experiments.nc08.experiment \
              --seed "$root" --steps 384 --discovery 1024 \
              --selection 512 --heldout 1024 --proposals 2048 --shams 8 \
              --out "/tmp/nc08-original/nc08_root_$root.json"
          done
      - name: Aggregate original root-cluster registered engineering verdict
        run: |
          python -m mechinterp.bpd.experiments.nc08.aggregate \
            --root-dir /tmp/nc08-original \
            --out /tmp/nc08-original/NC08_ORIGINAL_DEVELOPMENT_SUMMARY.json
      - name: Independently audit all eight original source and heldout receipts
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/nc08-original')
          summary=json.loads((root/'NC08_ORIGINAL_DEVELOPMENT_SUMMARY.json').read_text())
          assert summary['study']=='BPD-NC-08'
          assert summary['phase']=='DEVELOPMENT'
          assert summary['evidence_class']=='ENGINEERING_ONLY'
          assert summary['independent_model_roots']==8
          assert len(summary['per_root'])==8
          assert summary['scientific_confirmation_performed'] is False
          assert summary['independent_sham_calibration_roots_used']==0
          assert summary['independent_confirmation_roots_used']==0
          assert summary['original_development_verdict'] in (
              'ENGINEERING_POSITIVE','ENGINEERING_NULL_OR_INELIGIBLE'
          )
          assert {x['root'] for x in summary['per_root']}==set(range(800,808))
          for seed in range(800,808):
            path=root/('nc08_root_%d.json'%seed)
            doc=json.loads(path.read_text())
            assert doc['study']=='BPD-NC-08'
            assert doc['phase']=='DEVELOPMENT'
            assert doc['root']==seed and doc['training']['steps']==384
            assert doc['splits']=={
                'train':2048,'discovery':1024,'selection':512,'heldout':1024
            }
            assert doc['protocol_sha256']==summary['protocol_sha256']
            assert doc['clean_closure']['passed']
            assert set(doc['candidates_by_budget'])=={'8','10','12','14'}
            valid=next((b for b in (8,10,12,14)
                   if doc['candidates_by_budget'][str(b)]['eligible']),None)
            assert valid==doc['selected_total_rank']
            if valid is not None:
              assert sum(doc['selected_rank_tuple'])==valid
              assert all(2<=n<=6 for n in doc['selected_rank_tuple'])
              assert doc['sham_admission']['selected']<=8
              assert doc['sham_admission']['proposals']==2048
              assert len(doc['heldout']['selected']['kl_by_pass_nats'])==4
              assert doc['gauge']['max_full_rollout_logit_error']<=5e-5
              assert doc['gauge']['relative_physical_operator_error']<=1e-4
              if doc['eligible']:
                assert doc['sham_admission']['selected']==8
                assert len(doc['sham_heldout_nlls'])==8
            assert doc['heldout']['flat_rank3'] is not None
            assert doc['heldout']['flat_rank4'] is not None
            print('NC08 original root',seed,
                  'sha256',hashlib.sha256(path.read_bytes()).hexdigest(),
                  'budget',valid,'eligible',doc['eligible'])
          print('NC08 original development result:',summary['original_development_verdict'])
          print('NC08 original gates:',summary['gates'])
          PY
      - name: Retain unmodified original eight trained-root model receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-nc08-original-eight-root-development-${{ github.run_id }}
          path: /tmp/nc08-original/
          retention-days: 90
          if-no-files-found: warn
