name: BPD pretrained TRM learned RLT exit

on:
  push:
    branches:
      - research/rlt-learned-exit-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/learned_exit_controller.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_learned_exit_controller.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_exit.py"
      - ".github/workflows/bpd-learned-rlt-exit.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/learned_exit_controller.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_learned_exit_controller.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/native_trm_exit.py"
      - ".github/workflows/bpd-learned-rlt-exit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learned-rlt-exit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<3" "huggingface_hub>=0.24,<1"
      - name: Test logits-only controller and native recurrent continuation
        run: python -m unittest mechinterp.bpd.experiments.inkling_reader_v0.test_learned_exit_controller -v
      - name: Execute pinned pretrained training/calibration/development experiment
        if: github.event_name == 'push'
        run: |
          timeout --signal=TERM --kill-after=15s 850s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.learned_exit_controller \
            --model gaoxin492 --train-roots 96 --cal-roots 48 --dev-roots 48 \
            --holes 50 --out runs/rlt_learned_exit_20261121
      - name: Retain complete development and training receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-rlt-learned-exit-first-dev
          path: runs/rlt_learned_exit_20261121/
          if-no-files-found: warn
          retention-days: 7
