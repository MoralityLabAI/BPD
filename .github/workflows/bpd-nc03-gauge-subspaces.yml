name: BPD-NC-03 gauge-covariant recurrent subspaces
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/nc03/**'
      - '.github/workflows/bpd-nc03-gauge-subspaces.yml'
  workflow_dispatch:
jobs:
  source-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Bytecode and registered causal-unit tests
        run: |
          python -m compileall -q mechinterp/bpd/experiments/nc03
          python -m pytest -q mechinterp/bpd/experiments/nc03/test_experiment.py
      - name: Engineering smoke only, no confirmation
        run: |
          python -m mechinterp.bpd.experiments.nc03.experiment \
            --seed 300 --steps 128 --discovery-size 256 --evaluation-size 256 \
            --proposals 512 --out /tmp/nc03_smoke.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nc03_smoke.json'))
          assert r['study']=='BPD-NC-03' and r['phase']=='ENGINEERING'
          assert r['protocol_commit']=='a48871f2612f9032ddbf612747f972f701585536'
          for basis,d in r['bases'].items():
              print('engineering smoke',basis,d.get('status'),
                    d.get('primary_contrast_nats'),d.get('comparison_to_native'))
          print('null',r['nulls']['zero_readout'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc03-one-root-smoke
          path: /tmp/nc03_smoke.json
          if-no-files-found: warn
  development:
    runs-on: ubuntu-latest
    needs: source-and-smoke
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26' 'pytest>=8'
      - name: Registered eight-root engineering experiment
        run: |
          mkdir -p /tmp/nc03_results
          for seed in 300 301 302 303 304 305 306 307; do
            python -m mechinterp.bpd.experiments.nc03.experiment \
              --seed "$seed" --steps 128 --discovery-size 1024 \
              --evaluation-size 1024 --out "/tmp/nc03_results/nc03_root_${seed}.json"
          done
          python -m mechinterp.bpd.experiments.nc03.aggregate \
            --directory /tmp/nc03_results --out /tmp/nc03_results/NC03_SUMMARY.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nc03_results/NC03_SUMMARY.json'))
          assert d['n_independent_roots']==8
          assert d['scientific_status']=='NOT_CONFIRMATORY'
          assert d['development_resolution'] in ('ENGINEERING_POSITIVE_CONTROL','NOT_RESOLVED_OR_FAILED')
          print('preserved scientific outcome',d['development_resolution'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nc03-eight-root-full-engineering
          path: /tmp/nc03_results/
          if-no-files-found: warn
