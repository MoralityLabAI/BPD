name: BPD-AMM-11 prospective cosine versus learned memory

on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/amm11_cosine_transfer/**'
      - '.github/workflows/bpd-amm11-cosine-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engineering-training-and-development:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      ATEN_CPU_CAPABILITY: default
      MKL_CBWR: COMPATIBLE
      MKL_DYNAMIC: "FALSE"
      MKL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - name: Install previously accepted CPU PyTorch binary and exact NumPy version
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
          python -m pip install 'numpy==2.2.6'
      - name: Verify exact runtime and 16 engineering root/dose/parity/seal tests
        run: |
          python -m unittest mechinterp.bpd.experiments.amm11_cosine_transfer.test_experiment -v
      - name: Train 64 independent model roots and freeze a policy-only receipt
        shell: bash
        run: |
          if test -f mechinterp/bpd/experiments/amm11_cosine_transfer/results/TRAINING_LOCK.json; then
            python -m mechinterp.bpd.experiments.amm11_cosine_transfer.experiment \
              --phase training --out /tmp/amm11_training.json \
              --check-lock mechinterp/bpd/experiments/amm11_cosine_transfer/results/TRAINING_LOCK.json
          else
            python -m mechinterp.bpd.experiments.amm11_cosine_transfer.experiment \
              --phase training --out /tmp/amm11_training.json
          fi
          python - <<'PY'
          import json,pathlib
          from mechinterp.bpd.experiments.amm11_cosine_transfer import experiment as e
          run=json.loads(pathlib.Path('/tmp/amm11_training.json').read_text())
          compact=e.compact(run)
          print('AMM11_TRAINING_LOCK='+json.dumps(compact,sort_keys=True))
          committed=pathlib.Path('mechinterp/bpd/experiments/amm11_cosine_transfer/results/TRAINING_LOCK.json')
          if committed.exists():
              assert compact==json.loads(committed.read_text()),'AMM11 training policy drift'
              print('AMM11 source-locked 64-root CPU training replay PASS')
          else:
              print('AMM11 training-only stage: development forbidden until lock is committed')
          PY
      - name: Evaluate 64 independent development roots only after training lock
        shell: bash
        run: |
          if test -f mechinterp/bpd/experiments/amm11_cosine_transfer/results/DEVELOPMENT_LOCK.json; then
            echo 'AMM11 development already scored: do not generate a second cohort; use archive audit'
          elif test -f mechinterp/bpd/experiments/amm11_cosine_transfer/results/TRAINING_LOCK.json; then
            python -m mechinterp.bpd.experiments.amm11_cosine_transfer.experiment \
              --phase development --memory /tmp/amm11_training.json \
              --out /tmp/amm11_development.json
            python - <<'PY'
          import json,pathlib
          from mechinterp.bpd.experiments.amm11_cosine_transfer import experiment as e
          dev=json.loads(pathlib.Path('/tmp/amm11_development.json').read_text())
          compact=e.compact(dev)
          print('AMM11_DEVELOPMENT_LOCK='+json.dumps(compact,sort_keys=True))
          PY
          else
            echo 'AMM11 training digest not committed: prospective development blocked'
          fi
      - name: Corrected independent-root EvalMath preflight
        shell: bash
        run: |
          if test -f /tmp/amm11_development.json; then
            curl -fsSL https://raw.githubusercontent.com/MoralityLabAI/EvalMath/6d9c28dbe8e4c42b3fba76ae7adb84aed9f0921a/skills/evalmath-mechinterp-power/scripts/preflight.py -o /tmp/amm11_evalmath.py
            python - <<'PY'
          import json
          data=json.load(open('/tmp/amm11_development.json'))
          json.dump(data['preflight_input'],open('/tmp/amm11_pilot.json','w'))
          PY
            python /tmp/amm11_evalmath.py --pilot /tmp/amm11_pilot.json --out /tmp/amm11_preflight.json
            python - <<'PY'
          import json,pathlib
          verdict=json.loads(pathlib.Path('/tmp/amm11_preflight.json').read_text())
          print('AMM11_PREFLIGHT='+json.dumps(verdict,sort_keys=True))
          path=pathlib.Path('mechinterp/bpd/experiments/amm11_cosine_transfer/results/PREFLIGHT.json')
          if path.exists():
              assert verdict==json.loads(path.read_text()),'Corrected pinned EvalMath result drift'
          print('AMM11 confirmation remains sealed regardless of planning verdict')
          PY
          else
            echo 'AMM11 preflight blocked until source-locked development'
          fi
      - name: Preserve full training, development, pilot and decision receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amm11-full-source-locked-cpu-receipts
          if-no-files-found: ignore
          retention-days: 30
          path: |
            /tmp/amm11_training.json
            /tmp/amm11_development.json
            /tmp/amm11_pilot.json
            /tmp/amm11_preflight.json
