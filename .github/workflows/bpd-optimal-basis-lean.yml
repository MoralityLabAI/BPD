name: BPD idealized-L0 optimum and invariant-mask Lean certificates
on:
  push:
    paths:
      - 'mechinterp/bpd/theory/**'
      - '.github/workflows/bpd-optimal-basis-lean.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/theory/**'
      - '.github/workflows/bpd-optimal-basis-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-basis-and-mask-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run exact-rational four-case optimizer audit
        run: |
          python -m unittest discover -s mechinterp/bpd/theory -p 'test_finite_optima.py' -v
          python mechinterp/bpd/theory/finite_optima.py > /tmp/bpd-optimal-basis-finite.json
      - name: Install pinned Lean 4.19.0
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo '/tmp/lean-4.19.0-linux/bin' >> "$GITHUB_PATH"
      - name: Kernel-check the exact examples and intervention commutation
        run: |
          lean --version
          lean mechinterp/bpd/theory/OptimalBasis.lean | tee /tmp/bpd-optimal-basis-axioms.txt
          if grep -Eq 'sorryAx|ofReduceBool|depends on axioms:' /tmp/bpd-optimal-basis-axioms.txt; then
            echo 'Unexpected axiom in checked Lean theorem'
            exit 1
          fi
      - name: Upload rational receipts and proof/axiom output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-optimal-basis-${{ github.run_id }}
          path: |
            /tmp/bpd-optimal-basis-finite.json
            /tmp/bpd-optimal-basis-axioms.txt
          retention-days: 30
          if-no-files-found: warn
