name: BPD Fable pre-run source regression checks
on:
  push:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-math-and-donor-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --disable-pip-version-check pytest 'numpy>=1.26' numpy
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test archived failure predicates and new contrast/multiplicity/math semantics
        run: |
          python -m pytest -q mechinterp/bpd/tests/test_bpd_fable_preflight.py
      - name: Test phase-disjoint shared BPD dictionary control
        run: |
          python -m pytest -q mechinterp/bpd/theory/test_phase_disjoint_control.py
      - name: Execute preregistered BPD-PD-01 CPU controls
        run: |
          python -m mechinterp.bpd.theory.phase_disjoint_control --steps 100 --stage2-steps 25 --out /tmp/bpd-pd01-results.json
          python - <<'PY'
          import json
          receipt=json.load(open('/tmp/bpd-pd01-results.json'))
          assert len(receipt['arms']) == 6
          assert all(a['stage2_dictionary_bitwise_frozen'] for a in receipt['arms'])
          print('BPD-PD-01 registered directional criterion:',receipt['registered_primary_criterion_passed'])
          for a in receipt['arms']:
              r=a['heldout_selected']
              print('seed',a['seed'],'mixed',a['mixed'],'dictionary_trainable',
                    a['dictionary_trainable_in_stage1'],'MSE',round(r['reconstruction_mse'],5),
                    'axis_match',round(r['read_axis_match'],4),
                    'gate_pattern',a['phase_routing_meets_binary_pattern'])
          PY
      - name: Archive BPD-PD-01 signed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-pd01-phase-disjoint-${{ github.run_id }}
          path: /tmp/bpd-pd01-results.json
          retention-days: 30
          if-no-files-found: warn
      - name: BPD-PD-02 excluded-seed hard-mask engineering smoke
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd02/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd02/test_published_results.py
      - name: Check PD03 source and published 24-seed negative result
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd03/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd03/test_published_results.py
      - name: Verify PD04 source and independently audit the published result
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd04/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd04/test_published_results.py
      - name: PD05 count supervision and STE excluded-seed source checks
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd05/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd05/test_published_results.py
      - name: PD06 source-lock and independent 32-seed result replay
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd06/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd06/test_published_results.py
      - name: Verify BPD v3 local-only dither collector against tiny CPU recurrence
        run: |
          python -m pytest -q mechinterp/bpd/tests/test_v3_collect_native_dither.py mechinterp/bpd/tests/test_v3_prepare_native_roster.py
      - name: Verify BASIS-01 pass-pooled module capture on fake recursive model
        run: |
          python -m pytest -q mechinterp/bpd/tests/test_v3_basis_inputs.py
      - name: PD07 source and published 24-seed result replay
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd07/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd07/test_published_results.py
      - name: PD08 staged-factor source and original 24-seed result replay
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd08/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd08/test_published_results.py
      - name: PD09 source smoke, 24-seed registered replay and posthoc landscape
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd09/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd09/test_published_results.py
          python -m pytest -q mechinterp/bpd/theory/pd09/test_landscape.py
          python -m mechinterp.bpd.theory.pd09.landscape_audit --out /tmp/bpd-pd09-landscape-posthoc.json
      - name: PD10 source smoke and independent first-run 24-seed replay
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd10/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd10/test_published_results.py
      - name: PD11 excluded-seed global/local Givens and registered result replay
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd11/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd11/test_published_results.py
      - name: PD12 excluded-seed dimension-scaling source and BPD mask controls
        run: python -m pytest -q mechinterp/bpd/theory/pd12/test_experiment.py
      - name: Verify source module syntax
        run: |
          python -m compileall -q mechinterp/bpd
