name: BPD Fable pre-run source regression checks
on:
  push:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-math-and-donor-contrast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test archived failure predicates and new contrast/multiplicity/math semantics
        run: |
          python -m pytest -q mechinterp/bpd/tests/test_bpd_fable_preflight.py
      - name: Test phase-disjoint shared BPD dictionary control
        run: |
          python -m pytest -q mechinterp/bpd/theory/test_phase_disjoint_control.py
      - name: Execute preregistered BPD-PD-01 CPU controls
        run: |
          python -m mechinterp.bpd.theory.phase_disjoint_control --steps 100 --stage2-steps 25 --out /tmp/bpd-pd01-results.json
          python - <<'PY'
          import json
          receipt=json.load(open('/tmp/bpd-pd01-results.json'))
          assert len(receipt['arms']) == 6
          assert all(a['stage2_dictionary_bitwise_frozen'] for a in receipt['arms'])
          print('BPD-PD-01 registered directional criterion:',receipt['registered_primary_criterion_passed'])
          for a in receipt['arms']:
              r=a['heldout_selected']
              print('seed',a['seed'],'mixed',a['mixed'],'dictionary_trainable',
                    a['dictionary_trainable_in_stage1'],'MSE',round(r['reconstruction_mse'],5),
                    'axis_match',round(r['read_axis_match'],4),
                    'gate_pattern',a['phase_routing_meets_binary_pattern'])
          PY
      - name: Archive BPD-PD-01 signed receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-pd01-phase-disjoint-${{ github.run_id }}
          path: /tmp/bpd-pd01-results.json
          retention-days: 30
          if-no-files-found: warn
      - name: BPD-PD-02 excluded-seed hard-mask engineering smoke
        run: |
          python -m pytest -q mechinterp/bpd/theory/pd02/test_experiment.py
          python -m pytest -q mechinterp/bpd/theory/pd02/test_published_results.py
      - name: Check PD03 excluded-seed gate engineering before science lock
        run: python -m pytest -q mechinterp/bpd/theory/pd03/test_experiment.py
      - name: Verify source module syntax
        run: |
          python -m compileall -q mechinterp/bpd
