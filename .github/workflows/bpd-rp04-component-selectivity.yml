name: BPD RP04 component selectivity replay
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/component_selectivity/**'
      - 'mechinterp/bpd/experiments/training_steering_stability/**'
      - 'mechinterp/bpd/experiments/training_steering/**'
      - 'mechinterp/bpd/components.py'
      - '.github/workflows/bpd-rp04-component-selectivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-contract-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r mechinterp/bpd/experiments/component_selectivity/requirements.txt
      - name: Check component, gauge, pathway and data contracts
        run: python -m unittest discover -s mechinterp/bpd/experiments/component_selectivity -t . -p 'test_*.py' -v
      - name: Replay engineering checkpoints
        if: hashFiles('mechinterp/bpd/experiments/component_selectivity/results/smoke/summary.json') != ''
        run: python -m mechinterp.bpd.experiments.component_selectivity.audit mechinterp/bpd/experiments/component_selectivity/results/smoke --out /tmp/rp04_smoke_audit.json
      - name: Replay all exposed-root development checkpoints
        if: hashFiles('mechinterp/bpd/experiments/component_selectivity/results/development/summary.json') != ''
        run: python -m mechinterp.bpd.experiments.component_selectivity.audit mechinterp/bpd/experiments/component_selectivity/results/development --out /tmp/rp04_development_audit.json
