name: BPD RP04 component selectivity replay
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/experiments/component_selectivity/**'
      - 'mechinterp/bpd/experiments/training_steering_stability/**'
      - 'mechinterp/bpd/experiments/training_steering/**'
      - 'mechinterp/bpd/components.py'
      - '.github/workflows/bpd-rp04-component-selectivity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-contract-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU dependencies
        run: python -m pip install -r mechinterp/bpd/experiments/component_selectivity/requirements.txt
      - name: Check component, gauge, pathway and data contracts
        run: python -m unittest discover -s mechinterp/bpd/experiments/component_selectivity -t . -p 'test_*.py' -v
      - name: Generate and independently replay amended engineering draw
        run: |
          python -m mechinterp.bpd.experiments.component_selectivity.experiment --phase smoke --out /tmp/rp04_amended_smoke
          python -m mechinterp.bpd.experiments.component_selectivity.audit /tmp/rp04_amended_smoke --out /tmp/rp04_amended_smoke/independent_audit.json
      - name: Generate and independently replay replacement eight-root development draw
        if: hashFiles('mechinterp/bpd/experiments/component_selectivity/SOURCE_FREEZE.json') != ''
        run: |
          python -m mechinterp.bpd.experiments.component_selectivity.experiment --phase development --source-lock mechinterp/bpd/experiments/component_selectivity/SOURCE_FREEZE.json --out /tmp/rp04_development_v2
          python -m mechinterp.bpd.experiments.component_selectivity.audit /tmp/rp04_development_v2 --out /tmp/rp04_development_v2/independent_audit.json
      - name: Retain all available amended and replacement receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-rp04-development-${{ github.sha }}
          path: |
            /tmp/rp04_amended_smoke
            /tmp/rp04_development_v2
          if-no-files-found: warn
          retention-days: 90
