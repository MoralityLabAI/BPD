name: BPD pretrained learned exit difficulty support guard

on:
  push:
    branches:
      - research/rlt-exit-support-guard-20261121
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/exit_support_guard.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_exit_support_guard.py"
      - ".github/workflows/bpd-rlt-exit-support-guard.yml"
  pull_request:
    paths:
      - "mechinterp/bpd/experiments/inkling_reader_v0/exit_support_guard.py"
      - "mechinterp/bpd/experiments/inkling_reader_v0/test_exit_support_guard.py"
      - ".github/workflows/bpd-rlt-exit-support-guard.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bpd-exit-support-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_XET: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU model runtime
        run: |
          python -m pip install "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<3" "huggingface_hub>=0.24,<1"
      - name: Verify cutoff rule, native state continuation and fresh roots
        run: python -m unittest mechinterp.bpd.experiments.inkling_reader_v0.test_exit_support_guard -v
      - name: Fetch immutable original controller
        uses: actions/download-artifact@v4
        with:
          name: bpd-rlt-learned-exit-first-dev
          path: runs/frozen
          run-id: 44911864342
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Predeclared fresh 40/52 blank support-guard comparison
        if: github.event_name == 'push'
        run: |
          timeout --signal=TERM --kill-after=15s 850s \
            python -m mechinterp.bpd.experiments.inkling_reader_v0.exit_support_guard \
            --source runs/frozen --model gaoxin492 --roots-per-panel 24 \
            --out runs/rlt_exit_support_guard
      - name: Retain real paired verifier-grade and timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpd-rlt-exit-support-guard-new-roots
          path: runs/rlt_exit_support_guard/
          if-no-files-found: warn
          retention-days: 14
