name: BPD-CQ-05 prospective feedback and gauge pilot
on:
  pull_request:
    paths:
      - 'mechinterp/bpd/theory/cq05_feedback_gauge/**'
      - '.github/workflows/bpd-cq05-feedback-gauge.yml'
  workflow_dispatch:
jobs:
  cpu-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: python -m pip install 'torch==2.5.1' 'numpy>=1.26'
      - name: Excluded-root engineering and native masked-forward tests
        run: python -m unittest discover -s mechinterp/bpd/theory/cq05_feedback_gauge/tests -v
      - name: Source-locked prospective independent replay (only after receipt)
        run: |
          if test -f mechinterp/bpd/theory/cq05_feedback_gauge/results/LOCKED_COUNTS.json; then
            python -m mechinterp.bpd.theory.cq05_feedback_gauge.reference --backend independent --check --out /tmp/cq05_independent.json
          else
            echo "PROTOCOL ONLY: pilot cohort has not been scored"
          fi
      - name: Source-locked native BPDModel/TiedComponentLinear replay
        run: |
          if test -f mechinterp/bpd/theory/cq05_feedback_gauge/results/LOCKED_COUNTS.json; then
            python -m mechinterp.bpd.theory.cq05_feedback_gauge.reference --backend native --check --out /tmp/cq05_native.json
          else
            echo "PROTOCOL ONLY: pilot cohort has not been scored"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cq05-independent-and-native-raw
          if-no-files-found: ignore
          path: |
            /tmp/cq05_independent.json
            /tmp/cq05_native.json
